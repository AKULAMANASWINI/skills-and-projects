<script>
/* ============================ TRENDS ============================ */
const RANGES = [[30,"30 days"],[90,"90 days"],[365,"A year"]];
function viewTrends(){
  const to = todayISO(), from = addDays(to, -(state.trendRange - 1));
  const inRange = sessionsBetween(from, to);
  const live = allHobbies().filter(h => inRange.some(s => s.hobbyId === h.id));
  const out = el("div", {class:"stack"});

  if(!hasAnyData()){
    add(out, el("section", {class:"card"}, el("div", {class:"card-b tight"}, emptyState(
      "Nothing to chart yet", "Log a few sessions and this fills up: minutes a week, where the hours went, and the days you showed up."))));
    return out;
  }

  /* ---- range picker + headline figures ---- */
  add(out, el("div", {class:"form-actions"}, [
    el("div", {class:"chiprow", role:"group", "aria-label":"Time range"}, RANGES.map(([d, l]) =>
      el("button", {class:"chip", type:"button", "aria-pressed": String(state.trendRange === d), text:l,
        onclick:() => { state.trendRange = d; render(); }}))),
    el("span", {class:"spacer"}),
    el("button", {class:"btn btn-sm", type:"button", "aria-pressed":String(state.trendTable),
      text: state.trendTable ? "Show charts" : "Show table",
      onclick:() => { state.trendTable = !state.trendTable; render(); }}),
  ]));

  const mins = sum(inRange, s => s.minutes);
  const days = new Set(inRange.map(s => s.date));
  const byDay = {};
  inRange.forEach(s => { byDay[s.date] = (byDay[s.date] || 0) + s.minutes; });
  const busiest = Object.keys(byDay).sort((a,b) => byDay[b] - byDay[a])[0];
  add(out, el("div", {class:"tiles"}, [
    tile("Logged", fmtHours(mins), null, inRange.length + (inRange.length === 1 ? " session" : " sessions")),
    tile("Days on", days.size, " of " + state.trendRange, Math.round(days.size / state.trendRange * 100) + "% of days"),
    tile("Typical session", fmtMins(inRange.length ? mins / inRange.length : 0), null,
      "longest " + fmtMins(Math.max(0, ...inRange.map(s => s.minutes)))),
    tile("Best day", busiest ? fmtDate(busiest) : "—", null, busiest ? fmtMins(byDay[busiest]) : "No sessions yet"),
  ]));

  /* ---- minutes a week, stacked ---- */
  const nWeeks = Math.min(53, Math.ceil(state.trendRange / 7));
  const weekKeys = [];
  const firstWeek = weekStartOf(to, state.config.weekStart);
  for(let i = nWeeks - 1; i >= 0; i--) weekKeys.push({key: addDays(firstWeek, -7 * i)});
  const series = live.filter(h => !state.hidden[h.id]).map(h => {
    const by = {};
    weekKeys.forEach(w => {
      by[w.key] = sum(sessionsBetween(w.key, addDays(w.key, 6)).filter(s => s.hobbyId === h.id), s => s.minutes);
    });
    return {key: h.id, label: h.name, color: inkCss(h.ink), by};
  });
  const allSeries = live.map(h => ({key: h.id, label: h.name, color: inkCss(h.ink), off: !!state.hidden[h.id],
    note: fmtHours(sum(inRange.filter(s => s.hobbyId === h.id), s => s.minutes))}));
  const weekCard = el("section", {class:"card"}, [
    cardHead("Minutes a week", [el("span", {class:"eyebrow", text: nWeeks + " weeks to " + fmtDate(to)})]),
  ]);
  if(state.trendTable){
    add(weekCard, weeklyTable(weekKeys, live));
  } else {
    add(weekCard, el("div", {class:"chart-wrap"}, weeklyStack(weekKeys, series)));
    add(weekCard, legendFor(allSeries, key => { state.hidden[key] = !state.hidden[key]; render(); }));
    add(weekCard, el("div", {class:"note", style:"padding:0 16px 13px", text:"Click a hobby in the key to drop it from the stack."}));
  }
  add(out, weekCard);

  /* ---- where the hours went ---- */
  const totals = hobbyTotals();
  const rangeRows = live.map(h => {
    const mine = inRange.filter(s => s.hobbyId === h.id);
    return {label: h.name, color: inkCss(h.ink), minutes: sum(mine, s => s.minutes), sessions: mine.length};
  }).sort((a, b) => b.minutes - a.minutes);
  add(out, el("section", {class:"card"}, [
    cardHead("Where the hours went", [el("span", {class:"eyebrow", text:"Last " + state.trendRange + " days"})]),
    rangeRows.length
      ? el("div", {class:"chart-wrap"}, hoursByHobby(rangeRows))
      : el("div", {class:"card-b tight"}, emptyState("Nothing in this range", "Try a longer range.")),
  ]));

  /* ---- consistency ---- */
  add(out, consistencyCard());

  /* ---- when you do it ---- */
  const counts = new Array(24).fill(0);
  let timed = 0;
  inRange.forEach(s => { const h = hourOf(s.at); if(h !== null){ counts[h]++; timed++; } });
  if(timed > 0) add(out, el("section", {class:"card"}, [
    cardHead("When you do it", [el("span", {class:"eyebrow", text: timed + " timed sessions"})]),
    el("div", {class:"chart-wrap"}, hourHistogram(counts, "var(--accent)")),
    el("div", {class:"note", style:"padding:0 16px 13px",
      text:"Sessions by the hour they started. One series, so the title names it — no key needed."}),
  ]));

  /* ---- lifetime table, always available ---- */
  add(out, lifetimeTable(totals));
  return out;
}

function weeklyTable(weekKeys, hobbies){
  const wrap = el("div", {class:"tablewrap"});
  const head = el("tr", {}, [el("th", {text:"Week of"})].concat(
    hobbies.map(h => el("th", {text:h.name})), [el("th", {text:"Total"})]));
  const rows = weekKeys.map(w => {
    const vals = hobbies.map(h => sum(sessionsBetween(w.key, addDays(w.key, 6)).filter(s => s.hobbyId === h.id), s => s.minutes));
    return el("tr", {}, [el("td", {text: fmtDateFull(w.key)})].concat(
      vals.map(v => el("td", {text: v ? fmtMins(v) : "—"})),
      [el("td", {text: fmtMins(sum(vals))})]));
  }).reverse();
  const totals = hobbies.map(h => sum(weekKeys, w =>
    sum(sessionsBetween(w.key, addDays(w.key, 6)).filter(s => s.hobbyId === h.id), s => s.minutes)));
  add(wrap, el("table", {}, [
    el("thead", {}, head),
    el("tbody", {}, rows),
    el("tfoot", {}, el("tr", {}, [el("td", {text:"Total"})].concat(
      totals.map(v => el("td", {text: fmtHours(v)})), [el("td", {text: fmtHours(sum(totals))})]))),
  ]));
  return wrap;
}

function lifetimeTable(totals){
  const rows = allHobbies().filter(h => totals[h.id] && totals[h.id].sessions);
  if(!rows.length) return null;
  const st = {};
  rows.forEach(h => { st[h.id] = streak(h.id); });
  return el("section", {class:"card"}, [
    cardHead("Every hobby, all time", [el("span", {class:"eyebrow", text:"The same numbers as rows"})]),
    el("div", {class:"tablewrap"}, el("table", {}, [
      el("thead", {}, el("tr", {}, ["Hobby","Hours","Sessions","Average","Longest","Best streak","First","Last"]
        .map(t => el("th", {text:t})))),
      el("tbody", {}, rows.sort((a,b) => totals[b.id].minutes - totals[a.id].minutes).map(h => {
        const t = totals[h.id];
        return el("tr", {}, [
          el("td", {}, [swatchEl(inkCss(h.ink)), " " + h.name]),
          el("td", {text: r1(t.minutes / 60)}),
          el("td", {text: String(t.sessions)}),
          el("td", {text: fmtMins(t.minutes / t.sessions)}),
          el("td", {text: fmtMins(t.best)}),
          el("td", {text: st[h.id].longest + "d"}),
          el("td", {text: t.first ? fmtDate(t.first) : "—"}),
          el("td", {text: t.last ? fmtDate(t.last) : "—"}),
        ]);
      })),
      el("tfoot", {}, el("tr", {}, [
        el("td", {text:"All hobbies"}),
        el("td", {text: r1(sum(rows, h => totals[h.id].minutes) / 60)}),
        el("td", {text: String(sum(rows, h => totals[h.id].sessions))}),
        el("td", {text:"—"}), el("td", {text:"—"}),
        el("td", {text: streak(null).longest + "d"}),
        el("td", {text:"—"}), el("td", {text:"—"}),
      ])),
    ])),
  ]);
}
</script>
<script>
/* ---------------- the consistency grid ---------------- */
const HEAT_BANDS = [[1,"var(--q1)","under 30m"],[30,"var(--q2)","30m – 1h"],[60,"var(--q3)","1 – 2h"],
                    [120,"var(--q4)","2 – 4h"],[240,"var(--q5)","4h and up"]];
function heatColor(m){
  if(!m) return "var(--q0)";
  let c = "var(--q1)";
  HEAT_BANDS.forEach(b => { if(m >= b[0]) c = b[1]; });
  return c;
}
function consistencyCard(){
  const weeks = 53;
  const thisWeek = weekStartOf(todayISO(), state.config.weekStart);
  const start = addDays(thisWeek, -7 * (weeks - 1));
  const hid = state.heatHobby;
  const byDay = {};
  sessionsBetween(start, todayISO()).forEach(s => {
    if(hid && s.hobbyId !== hid) return;
    byDay[s.date] = (byDay[s.date] || 0) + s.minutes;
  });

  const dowLabels = el("div", {class:"heat-dow"});
  for(let i = 0; i < 7; i++){
    const d = (state.config.weekStart + i) % 7;
    add(dowLabels, el("span", {text: (i === 0 || i === 2 || i === 4) ? DOW_SHORT[d].slice(0,1) : ""}));
  }
  const grid = el("div", {class:"heat-in"}, dowLabels);
  const months = el("div", {class:"heat-months"});
  let lastMonth = "";
  for(let w = 0; w < weeks; w++){
    const colStart = addDays(start, 7 * w);
    const m = parseISO(colStart).getMonth();
    const label = (MON_SHORT[m] !== lastMonth && parseISO(colStart).getDate() <= 7) ? MON_SHORT[m] : "";
    if(label) lastMonth = label;
    add(months, el("span", {text: label}));
    const col = el("div", {class:"heat-col"});
    for(let d = 0; d < 7; d++){
      const date = addDays(colStart, d);
      if(date > todayISO()){ add(col, el("span", {class:"heat-cell", style:"background:transparent"})); continue; }
      const mins = byDay[date] || 0;
      add(col, el("button", {class:"heat-cell", type:"button", style:"background:" + heatColor(mins),
        title: fmtDateFull(date) + " — " + (mins ? fmtMins(mins) : "nothing logged"),
        "aria-label": fmtDateFull(date) + ", " + (mins ? fmtMins(mins) : "nothing logged"),
        onclick:() => { state.date = date; state.tab = "today"; render(); }}));
    }
    add(grid, col);
  }
  const key = el("div", {class:"heat-key"}, [
    el("span", {text:"Less"}),
    el("span", {class:"sw", style:"background:var(--q0)"}),
  ].concat(HEAT_BANDS.map(b => el("span", {class:"sw", style:"background:" + b[1], title:b[2]})))
   .concat([el("span", {text:"More"}), el("span", {style:"margin-left:auto", text:"Click a day to open it"})]));

  return el("section", {class:"card"}, [
    cardHead("Days you showed up", [
      el("span", {class:"eyebrow", text:"The last 52 weeks"}),
      el("select", {"aria-label":"Filter the grid by hobby", style:"width:auto; min-width:150px",
        onchange:e => { state.heatHobby = e.target.value; render(); }}, [
        el("option", {value:"", text:"All hobbies", selected: !hid}),
      ].concat(allHobbies().map(h => el("option", {value:h.id, text:h.name, selected: h.id === hid})))),
    ]),
    el("div", {class:"heat"}, [months, grid]),
    key,
  ]);
}

/* ============================ MILESTONES ============================ */
function viewMilestones(){
  const totals = hobbyTotals();
  const out = el("div", {class:"stack"});
  const st = streak(null);
  const all = allSessions();

  if(!all.length){
    add(out, el("section", {class:"card"}, el("div", {class:"card-b tight"}, emptyState(
      "No hours banked yet", "Hours accumulate here once you log a session: 10, 25, 50, 100 and on up, per hobby."))));
    /* The reading list and the project board come first for a reason — you
       line up what you are going to read before you have read any of it. */
    add(out, projectsCard());
    return out;
  }

  const longest = all.reduce((a, s) => s.minutes > (a ? a.minutes : 0) ? s : a, null);
  const byDay = {};
  all.forEach(s => { byDay[s.date] = (byDay[s.date] || 0) + s.minutes; });
  const bigDay = Object.keys(byDay).sort((a,b) => byDay[b] - byDay[a])[0];
  const weekTotals = {};
  all.forEach(s => { const k = weekStartOf(s.date, state.config.weekStart); weekTotals[k] = (weekTotals[k] || 0) + s.minutes; });
  const bigWeek = Object.keys(weekTotals).sort((a,b) => weekTotals[b] - weekTotals[a])[0];

  add(out, el("div", {class:"tiles"}, [
    tile("All time", fmtHours(sum(all, s => s.minutes)), null, all.length + " sessions since " + fmtDateFull(all[0].date)),
    tile("Longest streak", st.longest, st.longest === 1 ? " day" : " days", st.current ? "on " + st.current + " right now" : "not running"),
    tile("Longest session", fmtMins(longest ? longest.minutes : 0), null,
      longest ? hobbyName(longest.hobbyId) + " · " + fmtDate(longest.date) : ""),
    tile("Biggest week", fmtHours(bigWeek ? weekTotals[bigWeek] : 0), null, bigWeek ? "week of " + fmtDate(bigWeek) : ""),
  ]));
  add(out, el("div", {class:"note", style:"margin-top:-8px",
    text:"Best day so far: " + (bigDay ? fmtDateFull(bigDay) + ", " + fmtMins(byDay[bigDay]) : "—") + "."}));

  /* ---- hour milestones ---- */
  const cards = allHobbies().filter(h => totals[h.id] && totals[h.id].minutes > 0)
    .sort((a,b) => totals[b.id].minutes - totals[a.id].minutes);
  add(out, el("section", {class:"card"}, [
    cardHead("Hours banked", [el("span", {class:"eyebrow", text:"10 · 25 · 50 · 100 · 250 · 500 · 1000"})]),
    el("div", {class:"card-b tight"}, el("div", {class:"rows"}, cards.map(h => {
      const hrs = totals[h.id].minutes / 60;
      const next = MILESTONE_HOURS.find(m => hrs < m);
      const prev = [...MILESTONE_HOURS].reverse().find(m => hrs >= m) || 0;
      const pct = next ? clamp((hrs - prev) / (next - prev), 0, 1) : 1;
      return el("div", {class:"row", style:"align-items:stretch"}, [
        el("span", {class:"bar", style:"background:" + inkCss(h.ink)}),
        el("div", {class:"main", style:"gap:7px"}, [
          el("div", {class:"goal-top"}, [
            el("span", {style:"color:var(--ink); font-size:14px", text:h.name}),
            el("span", {class:"g", text: next ? r1(hrs) + " / " + next + "h" : r1(hrs) + "h — every milestone cleared"}),
          ]),
          el("div", {class:"meter"}, el("i", {style:"width:" + (pct * 100).toFixed(1) + "%; background:" + inkCss(h.ink)})),
          el("div", {class:"mstones"}, MILESTONE_HOURS.map(m =>
            el("span", {class:"mstone" + (hrs >= m ? " hit" : "")}, [el("span", {class:"dot"}), String(m) + "h"]))),
          next ? el("div", {class:"note", text: r1(next - hrs) + " hours to " + next + "h — about " +
            Math.ceil((next - hrs) * 60 / Math.max(1, totals[h.id].minutes / totals[h.id].sessions)) + " more sessions at your usual length."}) : null,
        ]),
      ]);
    }))),
  ]));

  /* ---- projects ---- */
  add(out, projectsCard());
  return out;
}
</script>
<script>
/* ---------------- projects ---------------- */
function projectsCard(){
  const all = [];
  allHobbies().forEach(h => h.projects.forEach(p => all.push({h, p})));
  const mins = {};
  allSessions().forEach(s => { if(s.projectId) mins[s.projectId] = (mins[s.projectId] || 0) + s.minutes; });
  const order = {making: 0, idea: 1, done: 2, shelved: 3};
  all.sort((a, b) => (order[a.p.status] - order[b.p.status]) || a.p.name.localeCompare(b.p.name));
  const list = el("div", {class:"projects"});
  if(!all.length){
    add(list, emptyState("Nothing on the go",
      "A project is the thing a hobby is working through — a dinner set, a linen shirt, a book. Books carry an author; everything else carries whoever made the pattern. Attach sessions to one and the hours add up.",
      el("button", {class:"btn btn-primary", type:"button", text:"Add one", onclick:() => editProject(null)})));
  }
  all.forEach(({h, p}) => {
    const cls = p.status === "done" ? "good" : p.status === "shelved" ? "" : p.status === "idea" ? "" : "accent";
    add(list, el("div", {class:"proj"}, [
      swatchEl(inkCss(h.ink)),
      el("div", {class:"pn"}, [
        p.name,
        el("small", {text: [
          p.by, h.name,
          mins[p.id] ? fmtHours(mins[p.id]) + " logged" : "",
          p.doneAt ? "finished " + fmtDate(p.doneAt) : "",
          p.note,
        ].filter(Boolean).join(" · ")}),
      ]),
      el("span", {class:"badge " + cls, text: statusLabel(p.status, h.cat)}),
      el("button", {class:"btn btn-sm btn-ghost", type:"button", text:"Edit", onclick:() => editProject({h, p})}),
    ]));
  });
  const books = all.filter(x => x.h.cat === "reading");
  const onGo = all.filter(x => x.p.status === "making").length;
  const done = all.filter(x => x.p.status === "done").length;
  return el("section", {class:"card"}, [
    cardHead(books.length ? "Books & projects" : "Projects", [
      el("span", {class:"eyebrow", text: onGo + " on the go · " + done + " finished"}),
      liveHobbies().length ? el("button", {class:"btn btn-sm", type:"button", text:"Add",
        onclick:() => editProject(null)}) : null,
    ]),
    el("div", {class:"card-b tight"}, list),
  ]);
}
function editProject(existing){
  const isNew = !existing;
  let hobbyId = existing ? existing.h.id : (liveHobbies()[0] || {}).id || "";
  const p = existing ? Object.assign({by: ""}, plain(existing.p))
    : {id: uid(), name: "", by: "", status: "making", note: "", createdAt: todayISO(), doneAt: ""};
  if(!hobbyId){ toast("Add a hobby first."); return; }
  let words = projectWords((hobby(hobbyId) || {}).cat);

  const nameLabel = el("label", {for:"pname", text:words.thing});
  const nameInput = el("input", {type:"text", id:"pname", maxlength:"90", placeholder:words.namePlaceholder,
    value:p.name, oninput:e => { p.name = e.target.value; }});
  const byLabel = el("label", {for:"pby", text:words.by});
  const byInput = el("input", {type:"text", id:"pby", maxlength:"90", placeholder:words.byPlaceholder,
    value:p.by, oninput:e => { p.by = e.target.value; }});
  const statusSel = el("select", {id:"pstatus", onchange:e => {
    p.status = e.target.value;
    if(p.status === "done" && !p.doneAt) p.doneAt = todayISO();
    if(p.status !== "done") p.doneAt = "";
    syncDone();
  }});
  const doneInput = el("input", {type:"date", id:"pdone", max:todayISO(), value:p.doneAt,
    oninput:e => { p.doneAt = e.target.value; }});
  const doneField = el("div", {class:"field"}, [el("label", {for:"pdone", text:words.doneLabel}), doneInput]);

  function paintStatus(){
    clear(statusSel);
    statusList((hobby(hobbyId) || {}).cat).forEach(([v, l]) =>
      add(statusSel, el("option", {value:v, text:l, selected: v === p.status})));
  }
  function syncDone(){
    doneField.hidden = p.status !== "done";
    doneInput.value = p.doneAt || "";
  }
  function reword(){
    words = projectWords((hobby(hobbyId) || {}).cat);
    nameLabel.textContent = words.thing;
    nameInput.placeholder = words.namePlaceholder;
    byLabel.textContent = words.by;
    byInput.placeholder = words.byPlaceholder;
    const t = $("modaltitle");
    if(t) t.textContent = (isNew ? "New " : "Edit ") + words.lower;
    paintStatus();
    syncDone();
  }
  paintStatus();
  syncDone();

  const body = [
    el("div", {class:"field"}, [nameLabel, nameInput]),
    el("div", {class:"field"}, [byLabel, byInput]),
    el("div", {class:"form-grid"}, [
      el("div", {class:"field"}, [
        el("label", {for:"phobby", text:"Hobby"}),
        hobbySelect("phobby", hobbyId, e => { hobbyId = e.target.value; reword(); }, {all:true, blank:"Choose a hobby"}),
      ]),
      el("div", {class:"field"}, [el("label", {for:"pstatus", text:"Status"}), statusSel]),
      doneField,
    ]),
    el("div", {class:"field"}, [
      el("label", {for:"pnote", text:"Note (optional)"}),
      el("input", {type:"text", id:"pnote", maxlength:"120", placeholder:"Where you got to, what you thought",
        value:p.note, oninput:e => { p.note = e.target.value; }}),
    ]),
  ];
  const foot = [
    !isNew ? el("button", {class:"btn btn-danger", type:"button", text:"Delete", onclick:() => {
      if(!confirm("Delete “" + p.name + "”? Sessions stay, they just stop pointing at it.")) return;
      closeModal();
      mutate(() => {
        const h = hobby(existing.h.id);
        h.projects = h.projects.filter(x => x.id !== p.id);
        const keys = ["hobby|" + h.id];
        monthList().forEach(k => {
          let hit = false;
          (state.months[k] || []).forEach(s => { if(s.projectId === p.id){ s.projectId = ""; hit = true; } });
          if(hit) keys.push("month|" + k);
        });
        return keys;
      });
    }}) : null,
    el("span", {class:"spacer"}),
    el("button", {class:"btn", type:"button", text:"Cancel", onclick:closeModal}),
    el("button", {class:"btn btn-primary", type:"button", text: isNew ? "Add" : "Save", onclick:() => {
      p.name = (p.name || "").trim();
      p.by = (p.by || "").trim();
      if(!p.name){ toast("Give the " + words.lower + " a name."); const f = $("pname"); if(f) f.focus(); return; }
      closeModal();
      mutate(() => {
        const keys = [];
        if(existing && existing.h.id !== hobbyId){
          const old = hobby(existing.h.id);
          old.projects = old.projects.filter(x => x.id !== p.id);
          keys.push("hobby|" + old.id);
        }
        const target = hobby(hobbyId);
        const i = target.projects.findIndex(x => x.id === p.id);
        if(i >= 0) target.projects[i] = p; else target.projects.push(p);
        keys.push("hobby|" + target.id);
        return keys;
      });
      toast(words.thing + (isNew ? " added." : " saved."));
    }}),
  ];
  openModal((isNew ? "New " : "Edit ") + words.lower, body, foot);
}

/* ============================ exports ============================ */
function csvCell(v){
  const s = v === null || v === undefined ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCsv(header, rows){
  return [header].concat(rows).map(r => r.map(csvCell).join(",")).join("\n") + "\n";
}
async function saveFile(filename, text){
  if(Persist.downloads){
    try{
      await Persist.downloads.save({filename, data: text});
      toast("Saved " + filename + ".");
      return;
    }catch(err){
      const code = err && err.code;
      if(code === "declined") return;
      if(code === "rate_limited"){ toast("One download at a time — try again in a moment."); return; }
      if(code === "too_large"){ toast("That export is too big to save here. Narrow the range and try again."); return; }
      /* anything else: fall through to the ordinary browser download */
    }
  }
  try{
    const blob = new Blob([text], {type: filename.endsWith(".json") ? "application/json" : "text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = el("a", {href:url, download:filename, style:"display:none"});
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
    toast("Saved " + filename + ".");
  }catch(e){ toast("This view will not let the page hand you a file."); }
}
function exportSessions(){
  const rows = allSessions().sort((a,b) => a.date.localeCompare(b.date) || (a.at || "").localeCompare(b.at || ""))
    .map(s => {
      const h = hobby(s.hobbyId);
      const proj = h && s.projectId ? h.projects.find(p => p.id === s.projectId) : null;
      return [s.date, s.at, h ? h.name : "", h ? h.cat : "", s.minutes, r1(s.minutes / 60),
        s.amount === null ? "" : s.amount, h ? h.unit : "", s.mood || "", moodLabel(s.mood),
        proj ? proj.name : "", proj ? proj.by : "", s.note];
    });
  saveFile("hobby-sessions.csv", toCsv(
    ["date","started_at","hobby","category","minutes","hours","amount","unit","mood","mood_label",
     "project","project_by","note"], rows));
}
function exportHobbies(){
  const totals = hobbyTotals();
  const rows = allHobbies().map(h => {
    const t = totals[h.id] || {minutes:0, sessions:0, amount:0, first:"", last:"", best:0};
    const st = streak(h.id);
    return [h.name, h.cat, h.unit, h.goalType, h.goalValue, h.archived ? "true" : "false",
      t.sessions, t.minutes, r1(t.minutes / 60), t.sessions ? Math.round(t.minutes / t.sessions) : 0,
      t.best, t.amount || "", st.current, st.longest, t.first, t.last, h.projects.length];
  });
  saveFile("hobby-summary.csv", toCsv(
    ["hobby","category","unit","goal_type","goal_value","archived","sessions","total_minutes","total_hours",
     "mean_minutes","longest_minutes","total_amount","current_streak_days","longest_streak_days",
     "first_session","last_session","projects"], rows));
}
function exportWeekly(){
  const all = allSessions();
  if(!all.length){ toast("Nothing to export yet."); return; }
  const bag = {};
  all.forEach(s => {
    const wk = weekStartOf(s.date, state.config.weekStart);
    const key = wk + "|" + s.hobbyId;
    if(!bag[key]) bag[key] = {wk, hobbyId: s.hobbyId, minutes: 0, sessions: 0, amount: 0, days: new Set()};
    bag[key].minutes += s.minutes; bag[key].sessions += 1;
    if(s.amount) bag[key].amount += s.amount;
    bag[key].days.add(s.date);
  });
  const rows = Object.values(bag)
    .sort((a,b) => a.wk.localeCompare(b.wk) || hobbyName(a.hobbyId).localeCompare(hobbyName(b.hobbyId)))
    .map(r => {
      const h = hobby(r.hobbyId);
      const goal = h && h.goalType !== "none" ? h.goalValue : "";
      const actual = h && h.goalType === "sessions" ? r.sessions : r.minutes;
      return [r.wk, addDays(r.wk, 6), h ? h.name : "", r.sessions, r.minutes, r1(r.minutes / 60),
        r.days.size, r.amount || "", h ? h.goalType : "", goal, goal === "" ? "" : (actual >= goal ? "true" : "false")];
    });
  saveFile("hobby-weekly.csv", toCsv(
    ["week_start","week_end","hobby","sessions","minutes","hours","days_active","amount","goal_type","goal_value","goal_met"], rows));
}
/* One row per book or project — the reading log as a table. */
function exportProjects(){
  const mins = {}, count = {}, first = {}, last = {};
  allSessions().forEach(s => {
    if(!s.projectId) return;
    mins[s.projectId] = (mins[s.projectId] || 0) + s.minutes;
    count[s.projectId] = (count[s.projectId] || 0) + 1;
    if(!first[s.projectId] || s.date < first[s.projectId]) first[s.projectId] = s.date;
    if(!last[s.projectId] || s.date > last[s.projectId]) last[s.projectId] = s.date;
  });
  const rows = [];
  allHobbies().forEach(h => h.projects.forEach(pr => rows.push([
    pr.name, pr.by, h.name, h.cat, pr.status, statusLabel(pr.status, h.cat),
    pr.createdAt, pr.doneAt, first[pr.id] || "", last[pr.id] || "",
    count[pr.id] || 0, mins[pr.id] || 0, r1((mins[pr.id] || 0) / 60), pr.note,
  ])));
  if(!rows.length){ toast("No books or projects to export yet."); return; }
  rows.sort((a, b) => String(b[7] || b[9] || "").localeCompare(String(a[7] || a[9] || "")));
  saveFile("hobby-projects.csv", toCsv(
    ["name","by","hobby","category","status","status_label","added","finished",
     "first_session","last_session","sessions","minutes","hours","note"], rows));
}
function exportBackup(){
  saveFile("hobby-ledger-backup.json", JSON.stringify({
    app: "hobby-ledger", version: 1, exportedAt: new Date().toISOString(),
    config: state.config, hobbies: state.hobbies, months: state.months,
  }, null, 2));
}
</script>
<script>
/* ============================ SETTINGS ============================ */
function viewSettings(){
  const out = el("div", {class:"stack"});
  const all = allSessions();
  const docs = 1 + Object.keys(state.hobbies).length + monthList().length + (state.timer ? 1 : 0);

  add(out, el("section", {class:"card"}, [
    cardHead("Where the ledger lives"),
    el("div", {class:"card-b", style:"display:flex; flex-direction:column; gap:10px"}, [
      el("p", {text: Persist.db
        ? "In this artifact’s document store. It follows you between devices and survives a republish."
        : "In this browser’s local storage. It stays on this device and this browser — nowhere else."}),
      el("div", {class:"note", text: Persist.db
        ? docs + " documents in use: one for preferences, one per hobby, one per month of sessions. The store holds 5,000."
        : "Nothing is sent anywhere. Clearing site data clears the ledger, so keep a backup."}),
      el("div", {class:"note", text: all.length
        ? all.length + " sessions across " + monthList().length + " months, " + fmtHours(sum(all, s => s.minutes)) + " all told."
        : "Nothing logged yet."}),
    ]),
  ]));

  add(out, el("section", {class:"card"}, [
    cardHead("Preferences"),
    el("div", {class:"card-b"}, el("div", {class:"form-grid"}, [
      el("div", {class:"field"}, [
        el("label", {for:"setweek", text:"Weeks start on"}),
        el("select", {id:"setweek", onchange:e => mutate(() => {
          state.config.weekStart = Number(e.target.value); return ["config"];
        })}, [[1,"Monday"],[0,"Sunday"],[6,"Saturday"]].map(([v, l]) =>
          el("option", {value:v, text:l, selected: state.config.weekStart === v}))),
      ]),
      el("div", {class:"field"}, [
        el("label", {text:"Theme"}),
        el("button", {class:"btn", type:"button", onclick:toggleTheme,
          text: currentTheme() === "dark" ? "Dark" : currentTheme() === "light" ? "Light" : "System"}),
      ]),
    ])),
  ]));

  add(out, el("section", {class:"card"}, [
    cardHead("Take the data out", [el("span", {class:"eyebrow", text:"ISO dates · minutes · snake_case"})]),
    el("div", {class:"card-b", style:"display:flex; flex-direction:column; gap:12px"}, [
      el("p", {class:"note", text:"Three tidy tables plus a full backup. One row per session, one per hobby, one per hobby-week — the shapes you would actually load somewhere."}),
      el("div", {class:"form-actions"}, [
        el("button", {class:"btn", type:"button", text:"Sessions CSV", onclick:exportSessions}),
        el("button", {class:"btn", type:"button", text:"Hobby summary CSV", onclick:exportHobbies}),
        el("button", {class:"btn", type:"button", text:"Weekly rollup CSV", onclick:exportWeekly}),
        el("button", {class:"btn", type:"button", text:"Books & projects CSV", onclick:exportProjects}),
        el("button", {class:"btn", type:"button", text:"JSON backup", onclick:exportBackup}),
      ]),
      el("hr", {class:"rule"}),
      el("div", {class:"field"}, [
        el("label", {for:"importfile", text:"Restore a JSON backup"}),
        el("input", {type:"file", id:"importfile", accept:"application/json,.json", onchange:importBackup}),
        el("span", {class:"note", text:"Sessions and hobbies are merged in by id — restoring the same file twice changes nothing."}),
      ]),
    ]),
  ]));

  add(out, el("section", {class:"card", style:"border-left:3px solid var(--critical)"}, [
    cardHead("Start over"),
    el("div", {class:"card-b", style:"display:flex; flex-direction:column; gap:10px"}, [
      el("p", {class:"note", text:"Deletes every hobby, session and project. There is no undo — export a backup first."}),
      el("div", {class:"form-actions"}, [
        el("button", {class:"btn btn-danger", type:"button", text:"Delete everything", onclick:() => {
          if(!confirm("Delete the whole ledger? Every hobby and session goes.")) return;
          if(!confirm("Really? This cannot be undone.")) return;
          const hobbyIds = Object.keys(state.hobbies), months = monthList();
          state.hobbies = {}; state.months = {}; state.timer = null; state.demo = false;
          hobbyIds.forEach(id => flush("hobby|" + id));
          months.forEach(k => flush("month|" + k));
          flush("timer");
          localSave();
          resetDraft();
          render();
          toast("Ledger cleared.");
        }}),
      ]),
    ]),
  ]));

  add(out, el("section", {class:"card"}, [
    cardHead("About"),
    el("div", {class:"card-b", style:"display:flex; flex-direction:column; gap:8px"}, [
      el("p", {class:"note", text:"Hobby Ledger keeps one row per session: how long, when, how it went, and what you did. Everything else on these tabs — streaks, goals, milestones, the grid — is computed from those rows, so nothing is stored twice and an export is the whole truth."}),
      el("p", {class:"note", text:"Eight inks, assigned in order and never recycled, so a hobby keeps its colour and a filter never repaints the rest of the chart."}),
    ]),
  ]));
  return out;
}

function importBackup(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let o;
    try{ o = JSON.parse(String(reader.result)); }
    catch(err){ toast("That file is not readable JSON."); return; }
    if(!o || (!o.hobbies && !o.months)){ toast("That does not look like a Hobby Ledger backup."); return; }
    const hobbyIds = [], monthKeys = new Set();
    mutate(() => {
      Object.values(o.hobbies || {}).forEach(h => {
        const n = normaliseHobby(h);
        state.hobbies[n.id] = n;
        hobbyIds.push(n.id);
      });
      Object.keys(o.months || {}).forEach(k => {
        const existing = state.months[k] || [];
        const seen = new Set(existing.map(s => s.id));
        (o.months[k] || []).forEach(raw => {
          const s = normaliseSession(raw);
          if(seen.has(s.id)) return;
          existing.push(s);
          seen.add(s.id);
        });
        state.months[k] = existing;
        monthKeys.add(k);
      });
      if(o.config) state.config = Object.assign(state.config, o.config);
      return hobbyIds.map(id => "hobby|" + id).concat([...monthKeys].map(k => "month|" + k), ["config"]);
    });
    toast("Restored " + hobbyIds.length + " hobbies and " + sum([...monthKeys], k => state.months[k].length) + " sessions.");
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* ============================ render ============================ */
const VIEWS = {today: viewToday, hobbies: viewHobbies, trends: viewTrends, milestones: viewMilestones, settings: viewSettings};
function render(){
  if(!state.loaded){
    clear($("view")).appendChild(el("div", {class:"card"},
      el("div", {class:"card-b", style:"color:var(--muted)", text:"Opening the ledger…"})));
    return;
  }
  /* tabs */
  const tabs = clear($("tabs"));
  TABS.forEach(([id, label]) => add(tabs, el("button", {
    class:"tab", type:"button", role:"tab", "aria-controls":"view", id:"tab-" + id,
    "aria-selected": String(state.tab === id),
    onclick:() => { state.tab = id; render(); $("view").focus(); }, text: label,
  })));
  /* date strip */
  const d = state.date, isToday = d === todayISO();
  $("ddow").textContent = DOW_SHORT[dowIndex(d)];
  $("ddate").textContent = fmtDate(d);
  $("dinput").value = d;
  $("dlabel").classList.toggle("is-today", isToday);
  $("dnext").disabled = d >= todayISO();
  $("brandsub").textContent = state.demo ? "Example ledger" : (Persist.db ? "Synced to this artifact" : "This browser only");
  /* body */
  const view = clear($("view"));
  view.setAttribute("aria-labelledby", "tab-" + state.tab);
  view.appendChild((VIEWS[state.tab] || viewToday)());
}

$("dprev").onclick = () => { state.date = addDays(state.date, -1); render(); };
$("dnext").onclick = () => { if(state.date < todayISO()){ state.date = addDays(state.date, 1); render(); } };
$("dtoday").onclick = () => { state.date = todayISO(); render(); };
$("dinput").onchange = e => { if(e.target.value){ state.date = e.target.value; render(); } };
$("themebtn").onclick = toggleTheme;

let resizeTimer = null;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(state.loaded) render(); }, 180);
});

/* ============================ boot ============================ */
async function boot(){
  let db = null, downloads = null;
  try{ if(window.claude && window.claude.use) db = await claude.use("db"); }catch(e){ db = null; }
  try{ if(window.claude && window.claude.use) downloads = await claude.use("downloads"); }catch(e){ downloads = null; }
  Persist.db = db;
  Persist.downloads = downloads;

  if(!db){
    if(!localLoad()) buildDemo();
    state.loaded = true;
    render();
    return;
  }
  /* Four subscriptions, registered once: preferences, hobbies, months, timer. */
  let arrivals = 0;
  const settle = () => {
    arrivals++;
    if(arrivals >= 4 && !state.loaded){
      state.loaded = true;
      if(!hasAnyData() && !Object.keys(state.hobbies).length) buildDemo();
    }
    if(state.loaded) render();
  };
  const onErr = e => { if(e && e.code) console.warn("db", e.code, e.message); settle(); };
  try{
    db.doc("config/app").onSnapshot(s => {
      const d = s.exists && s.data();
      if(d) state.config = Object.assign(state.config, d);
      settle();
    }, onErr);
    db.collection("hobbies").onSnapshot(s => {
      const bag = {};
      s.docs.forEach(doc => { const d = doc.data(); if(d) bag[doc.id] = normaliseHobby(Object.assign({}, d, {id: doc.id})); });
      if(s.size){ state.hobbies = bag; state.demo = false; }
      else if(!state.demo) state.hobbies = bag;
      settle();
    }, onErr);
    db.collection("sessions").orderBy("month", "desc").limit(120).onSnapshot(s => {
      const bag = {};
      s.docs.forEach(doc => {
        const d = doc.data();
        if(d && Array.isArray(d.items)) bag[doc.id] = d.items.map(normaliseSession);
      });
      if(s.size){ state.months = bag; state.demo = false; }
      else if(!state.demo) state.months = bag;
      settle();
    }, onErr);
    db.doc("timer/current").onSnapshot(s => {
      const d = s.exists && s.data();
      state.timer = (d && d.hobbyId) ? {hobbyId: d.hobbyId, startedAt: Number(d.startedAt) || Date.now()} : null;
      settle();
    }, onErr);
  }catch(e){
    console.warn(e);
    if(!state.loaded){ state.loaded = true; buildDemo(); render(); }
  }
  /* If the store never answers, open on the example ledger rather than a spinner. */
  setTimeout(() => {
    if(!state.loaded){
      state.loaded = true;
      if(!hasAnyData() && !Object.keys(state.hobbies).length) buildDemo();
      render();
    }
  }, 4500);
  render();
}

function startWith(hot){
  if(hot && typeof hot === "object"){
    if(hot.tab && VIEWS[hot.tab]) state.tab = hot.tab;
    if(hot.date) state.date = hot.date;
    if(typeof hot.trendRange === "number") state.trendRange = hot.trendRange;
    if(hot.heatHobby) state.heatHobby = hot.heatHobby;
  }
  boot();
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(() => ({tab: state.tab, date: state.date, trendRange: state.trendRange, heatHobby: state.heatHobby}));
  window.claude.hot.ready ? window.claude.hot.ready(startWith) : startWith(window.claude.hot.data);
} else {
  startWith(null);
}
</script>

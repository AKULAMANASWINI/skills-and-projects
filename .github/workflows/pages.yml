name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/wizardly-noether-2cbh0z]
    paths:
      - 'plate-and-barbell/index.html'
      - 'tools/build-standalone.mjs'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the standalone page
        run: node tools/build-standalone.mjs

      - name: Fail if the committed build is stale
        run: git diff --exit-code -- docs/index.html

      # enablement:true turns Pages on for the repo if it is not already,
      # so this works without visiting repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

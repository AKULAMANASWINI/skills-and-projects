<title>Plate &amp; Barbell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#F4F1E8; --card:#FBFAF5; --card-2:#F0EDE2; --line:#D8D2C0; --line-soft:#E6E1D2;
  --ink:#1F2E22; --body:#4A4A40; --muted:#8A8572;
  --moss:#4B6B4F; --moss-deep:#33472F; --coral:#C97155; --teal:#2E6B67;
  --coral-wash:rgba(201,113,85,.12); --moss-wash:rgba(75,107,79,.1); --teal-wash:rgba(46,107,103,.1);
  --s1:#C4562F; --s2:#008C81; --s3:#7B4F9B;
  --seq-1:#E6EAE0; --seq-2:#C8D2C0; --seq-3:#A6B79E; --seq-4:#82997B; --seq-5:#5E7A59; --seq-6:#42603E;
  --good:#3F7A44; --warning:#B9832A; --critical:#B4432E;
  --grid:#E6E1D2; --on-dark:#F4F1E8;
  --serif:Fraunces,Georgia,'Times New Roman',serif;
  --sans:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --plate-a:#2B5FCC; --plate-b:#E0B429; --plate-c:#3C8C5A; --plate-d:#EFEDE4; --plate-e:#C8362F; --plate-f:#B9BEC2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bone:#161B15; --card:#1E251D; --card-2:#252D23; --line:#343C30; --line-soft:#2A3227;
    --ink:#EDE8D9; --body:#C2BFAF; --muted:#8E9080;
    --moss:#9CBA98; --moss-deep:#CBDCC4; --coral:#E08D6D; --teal:#63ABA4;
    --coral-wash:rgba(224,141,109,.14); --moss-wash:rgba(156,186,152,.13); --teal-wash:rgba(99,171,164,.14);
    --s1:#D2703F; --s2:#1F9E92; --s3:#9A80C4;
    --good:#7FB37F; --warning:#D6A441; --critical:#E0715A;
    --grid:#2C3429; --on-dark:#161B15;
  }
}
:root[data-theme="dark"]{
  --bone:#161B15; --card:#1E251D; --card-2:#252D23; --line:#343C30; --line-soft:#2A3227;
  --ink:#EDE8D9; --body:#C2BFAF; --muted:#8E9080;
  --moss:#9CBA98; --moss-deep:#CBDCC4; --coral:#E08D6D; --teal:#63ABA4;
  --coral-wash:rgba(224,141,109,.14); --moss-wash:rgba(156,186,152,.13); --teal-wash:rgba(99,171,164,.14);
  --s1:#D2703F; --s2:#1F9E92; --s3:#9A80C4;
  --seq-1:#283022; --seq-2:#36432F; --seq-3:#4A5C41; --seq-4:#627A56; --seq-5:#87A179; --seq-6:#ADC49E;
  --good:#7FB37F; --warning:#D6A441; --critical:#E0715A;
  --grid:#2C3429; --on-dark:#161B15;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bone); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; padding-bottom:40px}
h1,h2,h3,h4{font-family:var(--serif); font-weight:500; margin:0; color:var(--moss-deep); text-wrap:balance; letter-spacing:-.01em}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.1rem} h4{font-size:1.02rem}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coral); outline-offset:2px}
.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- shell ---------- */
.app{display:flex; flex-direction:column; min-height:100%}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--bone); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px; margin:0 auto; padding:18px 24px 12px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:11px; margin-right:auto}
.brand-mark{width:30px; height:30px; flex:none}
.brand h1{font-size:1.35rem; line-height:1.1}
.brand .tag{margin-top:3px}

.people{display:flex; align-items:center; gap:0; border:1px solid var(--line); background:var(--card)}
.person-btn{display:flex; align-items:center; gap:7px; border:0; border-left:1px solid var(--line); background:transparent;
  color:var(--muted); padding:7px 13px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase}
.person-btn:first-child{border-left:0}
.person-btn .dot{width:8px; height:8px; border-radius:50%; flex:none}
.person-btn[aria-pressed="true"]{background:var(--card-2); color:var(--moss-deep); font-weight:700}
.datenav{display:flex; align-items:center; gap:0; border:1px solid var(--line); background:var(--card)}
.datenav button{border:0; border-left:1px solid var(--line); background:transparent; color:var(--moss);
  width:32px; height:32px; display:grid; place-items:center; font-size:15px}
.datenav button:first-child{border-left:0}
.datenav button:hover{background:var(--card-2)}
.datelabel{min-width:142px; text-align:center; height:32px; display:flex; align-items:center; justify-content:center;
  gap:8px; padding:0 12px; font-family:var(--mono); font-size:12px; position:relative; border-left:1px solid var(--line)}
.datelabel input{position:absolute; inset:0; opacity:0; width:100%; cursor:pointer}
.datelabel .dow{color:var(--coral); text-transform:uppercase; font-size:10px; letter-spacing:.08em}
.icon-btn{border:1px solid var(--line); background:var(--card); color:var(--moss); height:32px; padding:0 10px;
  display:grid; place-items:center; font-family:var(--mono); font-size:12px}
.icon-btn:hover{background:var(--card-2)}

.tabs{max-width:1080px; margin:0 auto; padding:0 24px; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--mono); font-size:12px; letter-spacing:.05em; text-transform:uppercase; background:none; border:none;
  padding:14px 16px; color:var(--muted); white-space:nowrap; border-bottom:2px solid transparent; flex:none}
.tab[aria-selected="true"]{color:var(--moss-deep); border-bottom-color:var(--coral); font-weight:700}
main{max-width:1080px; width:100%; margin:0 auto; padding-inline:24px; padding-block:28px 56px; flex:1}

/* ---------- banner ---------- */
.banner{display:flex; gap:14px; align-items:center; flex-wrap:wrap; border:1px solid var(--line); border-left:3px solid var(--coral);
  background:var(--card); padding:14px 18px; margin-bottom:22px; font-size:.92rem; color:var(--body)}
.banner strong{color:var(--ink)}
.banner .spacer{margin-left:auto}

/* ---------- structure ---------- */
.section-head{display:flex; align-items:baseline; gap:14px; margin:0 0 16px}
.section-head .line{flex:1; height:1px; background:var(--line)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}
.card{background:var(--card); border:1px solid var(--line)}
.card.coral{border-left:3px solid var(--coral)} .card.teal{border-left:3px solid var(--teal)}
.card-h{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.card-h h2,.card-h h3{margin-right:auto}
.card-b{padding:18px 20px}
.stack{display:flex; flex-direction:column; gap:18px}

.btn{border:1px solid var(--line); background:transparent; color:var(--ink); padding:6px 12px; border-radius:2px;
  font-size:.86rem; font-weight:500}
.btn:hover{background:var(--card-2); border-color:var(--muted)}
.btn-accent{background:var(--moss-deep); border-color:var(--moss-deep); color:var(--on-dark); font-weight:600}
.btn-accent:hover{background:var(--moss); border-color:var(--moss); color:var(--on-dark)}
.btn-sm{padding:3px 9px; font-size:.8rem}
.btn-ghost{border-color:transparent; color:var(--muted)}
.btn-ghost:hover{background:var(--card-2); border-color:transparent; color:var(--ink)}
.btn-danger{color:var(--critical)}
.btn-danger:hover{border-color:var(--critical); background:transparent}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* ---------- fuel ---------- */
.fuel-top{display:flex; gap:22px; align-items:center; flex-wrap:wrap}
.ring-wrap{position:relative; flex:none; width:120px; height:120px}
.ring-center{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.ring-center .big{font-family:var(--serif); font-size:1.9rem; font-weight:500; line-height:1.05; color:var(--moss-deep); font-variant-numeric:tabular-nums}
.ring-center .sub{font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.04em}
.macros{flex:1 1 230px; display:flex; flex-direction:column; gap:12px; min-width:200px}
.macro-row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center}
.macro-row .lbl{display:flex; align-items:center; gap:7px; font-size:.86rem; min-width:66px}
.swatch{width:9px; height:9px; flex:none}
.bar{height:6px; background:var(--card-2); overflow:hidden; border:1px solid var(--line-soft)}
.bar i{display:block; height:100%}
.macro-row .val{font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap}
.macro-row .val b{color:var(--ink); font-weight:700}

.meal{border-top:1px solid var(--line)}
.meal-h{display:flex; align-items:baseline; gap:10px; padding:13px 20px 9px}
.meal-h .name{font-family:var(--serif); font-size:1.02rem; color:var(--moss-deep)}
.meal-h .kcal{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--coral); font-weight:700}
.entry{display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:9px 20px; border-top:1px solid var(--line-soft)}
.entry:hover{background:var(--card-2)}
.entry .nm{font-size:.9rem; line-height:1.3}
.entry .qty{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.entry .mac{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-align:right; white-space:nowrap}
.entry .kc{font-family:var(--mono); font-size:.86rem; font-weight:700; color:var(--coral); min-width:50px; text-align:right}
.empty{padding:11px 20px; color:var(--muted); font-size:.88rem; border-top:1px solid var(--line-soft)}
.add-row{padding:11px 20px 14px; border-top:1px solid var(--line-soft)}

/* ---------- iron ---------- */
.ex{border-top:1px solid var(--line); padding:14px 20px}
.ex-h{display:flex; align-items:center; gap:9px; margin-bottom:9px; flex-wrap:wrap}
.ex-h .nm{font-family:var(--serif); font-size:1.05rem; color:var(--moss-deep)}
.tag{font-family:var(--mono); font-size:10.5px; padding:2px 8px; border-radius:2px; display:inline-block}
.tag-moss{color:var(--moss); background:var(--moss-wash)}
.tag-teal{color:var(--teal); background:var(--teal-wash)}
.tag-coral{color:var(--coral); background:var(--coral-wash); font-weight:700}
.ex-h .vol{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted)}
.sets{display:flex; flex-direction:column; gap:6px; max-width:430px}
.setrow{display:grid; grid-template-columns:20px 1fr 1fr 32px 28px; gap:7px; align-items:center}
.setrow .idx{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-align:center}
.inp{width:100%; border:1px solid var(--line); background:var(--bone); color:var(--ink); border-radius:2px;
  padding:6px 9px; font-family:var(--mono); font-size:.85rem; min-width:0}
.inp::placeholder{color:var(--muted); font-family:var(--sans)}
.inp:focus{border-color:var(--moss); background:var(--card)}
.chk{width:28px; height:28px; border-radius:2px; border:1px solid var(--line); background:var(--bone);
  display:grid; place-items:center; color:var(--muted); font-size:12px}
.chk[aria-pressed="true"]{background:var(--moss-deep); border-color:var(--moss-deep); color:var(--on-dark)}
.planned{font-family:var(--mono); font-size:11px; color:var(--muted)}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); border-top:1px solid var(--line)}
.tile{padding:14px 18px; border-left:1px solid var(--line)}
.tile:first-child{border-left:0}
.tile .k{font-family:var(--serif); font-size:1.6rem; font-weight:500; color:var(--moss-deep); line-height:1.1; font-variant-numeric:tabular-nums}
.tile .l{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-top:4px}
.tile .d{font-family:var(--mono); font-size:11px; margin-top:4px}

/* ---------- plate calculator ---------- */
.plates{display:flex; align-items:center; gap:2px; flex-wrap:wrap; min-height:48px}
.plate{border:1px solid rgba(0,0,0,.3); display:grid; place-items:center; font-family:var(--mono); font-size:9px;
  font-weight:700; color:#fff; text-shadow:0 1px 1px rgba(0,0,0,.45)}
.bar-stub{height:6px; width:28px; background:var(--muted)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:.9rem}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; white-space:nowrap}
td.n,th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
td.kcal{font-family:var(--mono); color:var(--coral); font-weight:700; white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--card-2)}

/* ---------- plan ---------- */
.week{display:grid; grid-template-columns:repeat(auto-fit,minmax(184px,1fr)); gap:14px}
.day-card{border:1px solid var(--line); background:var(--card); overflow:hidden}
.day-card.today{border-color:var(--coral)}
.day-card .dow{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--coral);
  padding:14px 16px 0}
.day-card .title{padding:3px 16px 10px; font-family:var(--serif); font-size:1.08rem; color:var(--moss-deep)}
.day-card ul{list-style:none; margin:0; padding:0 16px 11px; display:flex; flex-direction:column; gap:5px}
.day-card li{font-size:.84rem; display:flex; gap:8px; align-items:baseline; color:var(--body)}
.day-card li > span:first-child{flex:1 1 auto; min-width:0; overflow-wrap:anywhere}
.day-card li > span + span{flex:none; margin-left:auto; font-family:var(--mono); font-size:10.5px;
  color:var(--muted); white-space:nowrap}
.day-card .slot{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); margin-top:4px}
.day-card .foot{padding:9px 16px; border-top:1px solid var(--line); display:flex; gap:7px}
.rest{color:var(--muted); font-size:.84rem; padding:0 16px 11px}

/* ---------- charts ---------- */
.chart{width:100%; display:block; overflow:visible}
.legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center; padding:0 0 12px}
.legend .it{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; color:var(--muted)}
.tip{position:fixed; z-index:80; pointer-events:none; background:var(--card); border:1px solid var(--muted);
  padding:9px 12px; font-size:.82rem; min-width:118px}
.tip .t{font-family:var(--serif); font-size:.95rem; color:var(--moss-deep); margin-bottom:5px}
.tip .r{display:flex; gap:12px; align-items:center; font-family:var(--mono); font-size:11px}
.tip .r span:last-child{margin-left:auto; font-weight:700; color:var(--ink)}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(31,46,34,.5); z-index:60; display:flex; align-items:flex-end; justify-content:center}
@media(min-width:640px){.scrim{align-items:center}}
.modal{background:var(--card); width:100%; max-width:580px; max-height:86vh; display:flex; flex-direction:column; border:1px solid var(--line)}
.modal-h{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line)}
.modal-h h2{margin-right:auto}
.modal-b{padding:18px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:14px}
.modal-f{padding:13px 20px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.field .inp,.field select,.field textarea{width:100%; border:1px solid var(--line); background:var(--bone); color:var(--ink);
  border-radius:2px; padding:8px 10px; font-size:.92rem}
.field select{font-family:var(--sans)}
.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(136px,1fr)); gap:12px}
.results{display:flex; flex-direction:column; border:1px solid var(--line); max-height:300px; overflow-y:auto}
.res{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:10px 13px; background:var(--card);
  border:0; border-bottom:1px solid var(--line-soft); text-align:left; width:100%}
.res:last-child{border-bottom:0}
.res:hover,.res:focus-visible{background:var(--coral-wash)}
.res .nm{font-size:.9rem}
.res .meta{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.res .kc{font-family:var(--mono); font-size:11px; color:var(--coral); white-space:nowrap}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:90;
  background:var(--moss-deep); color:var(--on-dark); padding:10px 18px; font-family:var(--mono); font-size:12px}
.seg{display:inline-flex; border:1px solid var(--line); background:var(--card)}
.seg button{border:0; border-left:1px solid var(--line); background:transparent; color:var(--muted); padding:5px 12px;
  font-family:var(--mono); font-size:11px; letter-spacing:.04em}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--card-2); color:var(--moss-deep); font-weight:700}
.water{display:flex; gap:5px; flex-wrap:wrap}
.glass{width:20px; height:27px; border:1px solid var(--line); background:transparent; border-radius:0 0 3px 3px}
.glass.on{background:var(--teal-wash); border-color:var(--teal)}
.note{font-size:.86rem; color:var(--body)}
.notes-box{background:var(--card-2); border:1px solid var(--line); padding:14px 18px; font-size:.88rem; color:var(--body)}
.notes-box strong{color:var(--ink)}
footer.legal{max-width:1080px; margin:44px auto 0; padding:22px 24px 0; border-top:1px solid var(--line);
  font-size:.82rem; color:var(--muted)}
@media (max-width:820px){ .grid2{grid-template-columns:1fr} }
@media (max-width:640px){
  .topbar-in{padding:14px 16px 10px} .tabs{padding:0 16px} main{padding-inline:16px}
  footer.legal{padding-inline:16px} table{font-size:.82rem} th,td{padding:8px 7px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="app">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="11" cy="16" r="8.4" fill="none" stroke="var(--moss)" stroke-width="2.2"/>
          <circle cx="11" cy="16" r="2.6" fill="var(--coral)"/>
          <rect x="19.4" y="14.6" width="3" height="2.8" fill="var(--moss-deep)"/>
          <rect x="23.8" y="11.2" width="4.4" height="9.6" fill="var(--moss-deep)"/>
        </svg>
        <div>
          <h1>Plate &amp; Barbell</h1>
          <div class="eyebrow">Madhu &amp; Aravind · training together</div>
        </div>
      </div>
      <div class="people" id="people" role="group" aria-label="Whose log"></div>
      <div class="datenav">
        <button id="prevDay" title="Previous day" aria-label="Previous day">&#8249;</button>
        <div class="datelabel"><span id="dateText">—</span><span class="dow" id="dateDow"></span>
          <input type="date" id="datePick" aria-label="Pick a date">
        </div>
        <button id="nextDay" title="Next day" aria-label="Next day">&#8250;</button>
        <button id="todayBtn" class="icon-btn" title="Jump to today" aria-label="Jump to today" style="width:auto;padding:0 9px;font-size:12px;font-weight:600">Today</button>
      </div>
      <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">&#9681;</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>

<script>

function defaultPlan(){

  /* Mon / Wed / Fri / Sun together, built around the gym's equipment. */
  return {
    mon: D("Lower + Core",[{exId:"back_squat",sets:4,reps:8},{exId:"rdl",sets:3,reps:10},

                     {exId:"assisted_dip",sets:3,reps:10},{exId:"cable_fly",sets:3,reps:12},{exId:"tricep_pushdown",sets:3,reps:12}]),
    thu: D("Rest · 10k steps",[]),
    fri: D("Upper Pull",[{exId:"assisted_pullup",sets:4,reps:8},{exId:"seated_row",sets:3,reps:10},
                     {exId:"barbell_row",sets:3,reps:10},{exId:"face_pull",sets:3,reps:15},{exId:"db_curl",sets:3,reps:12}]),
    sat: D("Rest · 10k steps",[]),

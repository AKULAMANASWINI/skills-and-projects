                     {exId:"trx_row",sets:3,reps:12},{exId:"farmers",sets:3,reps:1},{exId:"plank",sets:3,reps:1}])
  };
}
function defaultMealPlan(){
  const m=(b,l,d,s)=>({breakfast:b,lunch:l,dinner:d,snack:s});
  const base = m(["oats","milk_toned","banana","whey"],["white_rice","dal","chicken_breast","salad"],
                 ["roti","mixed_veg","paneer","curd"],["greek_yogurt","almonds"]);
  const o = {};
  WEEK_ORDER.forEach(d=>{ o[d]=JSON.parse(JSON.stringify(base)); });
  o.sat.dinner=["biryani","salad"]; o.sun.breakfast=["idli","coffee_milk"]; o.sun.lunch=["dosa","chana","curd"];
  return o;
}
function defaultProfile(id,name,sex,age,h,w,goal){
  return {id,name,sex,age,heightCm:h,weightKg:w,activity:1.55,goal,
          targets:{auto:true,kcal:0,p:0,c:0,f:0,fib:0,water:8,steps:10000},
          plan:defaultPlan(), mealPlan:defaultMealPlan()};
}
const state = {
  profiles:{ p1:defaultProfile("p1","Madhu","female",30,147.3,58.5,"cut"),
             p2:defaultProfile("p2","Aravind","male",32,180.3,79,"bulk") },
  days:{p1:{},p2:{}},
  custom:{foods:[],exercises:[]},
  active:"p1", compare:false, date:todayISO(), tab:"today",
  units:"imperial", trendRange:30, trendTable:false, demo:false, loaded:false
};

/* ---- targets: Mifflin-St Jeor -> TDEE -> macro split ---- */
function computeTargets(p){
  if(!p.targets.auto) return p.targets;
  const bmr = 10*p.weightKg + 6.25*p.heightCm - 5*p.age + (p.sex==="male"?5:-161);
  const tdee = bmr * (p.activity||1.55);
  const adj = p.goal==="cut" ? -0.18 : p.goal==="bulk" ? 0.12 : 0;
  const kcal = Math.round((tdee*(1+adj))/10)*10;
  const perKg = p.goal==="cut" ? 2.0 : 1.8;
  const prot = Math.round(perKg*p.weightKg);
  const fat  = Math.round((kcal*0.25)/9);
  const carb = Math.max(0, Math.round((kcal - prot*4 - fat*9)/4));
  return {auto:true, kcal, p:prot, c:carb, f:fat, fib:Math.round(kcal/1000*14), water:p.targets.water||8,
          steps:p.targets.steps||10000, bmr:Math.round(bmr), tdee:Math.round(tdee)};
}
function bmrOf(p){ return Math.round(10*p.weightKg + 6.25*p.heightCm - 5*p.age + (p.sex==="male"?5:-161)); }

/* ---- lookups ---- */
function allFoods(){ return FOODS.concat(state.custom.foods); }
function allExercises(){ return EXERCISES.concat(state.custom.exercises); }
const foodMap = ()=>{ const m={}; allFoods().forEach(f=>m[f.id]=f); return m; };
const exMap = ()=>{ const m={}; allExercises().forEach(e=>m[e.id]=e); return m; };
function foodById(id){ return foodMap()[id]; }
function exById(id){ return exMap()[id]; }

/* ---- day model ---- */
function blankDay(date){
  return {date, meals:{breakfast:[],lunch:[],dinner:[],snack:[]},
          workout:{name:"", exercises:[], cardio:[], notes:""},
          water:0, weightKg:null, steps:null};
}
function getDay(pid,date,create){
  const bag = state.days[pid] || (state.days[pid]={});
  if(!bag[date]){ if(!create) return blankDay(date); bag[date]=blankDay(date); }
  return bag[date];
}
function entryMacros(e){
  if(e.custom) return {kcal:+e.custom.kcal||0,p:+e.custom.p||0,c:+e.custom.c||0,f:+e.custom.f||0,fib:+e.custom.fib||0};
  const f = foodById(e.foodId); if(!f) return {kcal:0,p:0,c:0,f:0,fib:0};
  const k = (e.grams||0)/100;
  return {kcal:f.kcal*k, p:f.p*k, c:f.c*k, f:f.f*k, fib:(f.fib||0)*k};
}
function dayTotals(day){
  const t={kcal:0,p:0,c:0,f:0,fib:0};
  MEALS.forEach(([m])=> (day.meals[m]||[]).forEach(e=>{ const x=entryMacros(e);
    t.kcal+=x.kcal; t.p+=x.p; t.c+=x.c; t.f+=x.f; t.fib+=x.fib; }));
  return t;
}
function mealTotals(day,m){
  const t={kcal:0,p:0,c:0,f:0,fib:0};
  (day.meals[m]||[]).forEach(e=>{ const x=entryMacros(e); t.kcal+=x.kcal; t.p+=x.p; t.c+=x.c; t.f+=x.f; t.fib+=x.fib; });
  return t;
}
const e1rm = (w,reps)=> (!w||!reps) ? 0 : w*(1+reps/30);
function workoutStats(day){
  let volume=0, sets=0, reps=0, best={};
  (day.workout.exercises||[]).forEach(ex=>{
    (ex.sets||[]).forEach(s=>{
      if(!s.done) return;
      const w=+s.weight||0, r=+s.reps||0;
      volume += w*r; sets++; reps+=r;
      const e=e1rm(w,r); if(e>(best[ex.exId]||0)) best[ex.exId]=e;
    });
  });
  let cardioMin=0, cardioKcal=0;
  (day.workout.cardio||[]).forEach(c=>{ cardioMin+=+c.minutes||0; cardioKcal+=+c.kcal||0; });
  return {volume, sets, reps, best, cardioMin, cardioKcal};
}
function cardioKcal(exId, minutes, weightKg){
  const e = exById(exId); const met = (e&&e.met)||6;
  return Math.round(met * 3.5 * (weightKg||70) / 200 * (minutes||0));
}
/* Best e1RM for an exercise before a given date — used for PR badges. */
function historicBest(pid, exId, beforeDate){
  let best=0;
  const bag = state.days[pid]||{};
  for(const d in bag){ if(d>=beforeDate) continue;
    (bag[d].workout.exercises||[]).forEach(ex=>{ if(ex.exId!==exId) return;
      (ex.sets||[]).forEach(s=>{ if(!s.done) return; const e=e1rm(+s.weight||0,+s.reps||0); if(e>best) best=e; }); });
  }
  return best;
}

/* ============================ persistence ============================ */
const LS_KEY = "plate_barbell_v1";
const Persist = { db:null, subs:[], ready:false };
const pending = new Map();
function save(key){
  if(state.demo) return;
  if(pending.has(key)) clearTimeout(pending.get(key));
  pending.set(key, setTimeout(()=>{ pending.delete(key); flush(key).catch(e=>console.warn("save failed",key,e)); }, 400));
}
function cleanProfile(p){ return JSON.parse(JSON.stringify(p)); }
async function flush(key){
  const parts = key.split("|");
  if(!Persist.db){ localSave(); return; }
  try{
    if(parts[0]==="profile") await Persist.db.doc("profiles/"+parts[1]).set(cleanProfile(state.profiles[parts[1]]));
    else if(parts[0]==="day"){
      const d = state.days[parts[1]] && state.days[parts[1]][parts[2]];
      if(d) await Persist.db.doc("profiles/"+parts[1]+"/days/"+parts[2]).set(JSON.parse(JSON.stringify(d)));
    }
    else if(parts[0]==="lib") await Persist.db.doc("library/custom").set(JSON.parse(JSON.stringify(state.custom)));
    else if(parts[0]==="config") await Persist.db.doc("config/app").set({units:state.units, active:state.active});
  }catch(err){
    if(err && err.code==="quota_exceeded") toast("Storage is full — export and prune old days.");
    else if(err && err.code==="invalid_argument") toast("This view can read the log but not write to it.");
    else console.warn(err);
  }
}
function localSave(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({profiles:state.profiles, days:state.days, custom:state.custom, units:state.units, active:state.active})); }
  catch(e){ /* private window or full quota — the session still works in memory */ }
}
function localLoad(){
  try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const o=JSON.parse(raw);
    if(o.profiles) PIDS.forEach(p=>{ if(o.profiles[p]) state.profiles[p]=Object.assign(state.profiles[p],o.profiles[p]); });
    if(o.days) state.days=Object.assign({p1:{},p2:{}},o.days);
    if(o.custom) state.custom=Object.assign({foods:[],exercises:[]},o.custom);
    if(o.units) state.units=o.units;
    if(o.active) state.active=o.active;
    return hasAnyData();
  }catch(e){ return false; }
}
function hasAnyData(){
  return PIDS.some(p => Object.keys(state.days[p]||{}).length>0);
}
</script>

<script>
/* ============================ example week (shown only on an empty log) ============================ */
const BODYWEIGHT_EX = new Set(["pullup","chinup","dips","push_up","plank","hanging_leg","russian_twist","ab_wheel",
 "dead_bug","burpee","lunge","cable_crunch","assisted_pullup","assisted_dip","trx_row","trx_pushup","trx_fallout","trx_split_squat"]);
const DEMO_LOAD = {bench_press:[35,70],back_squat:[45,95],deadlift:[60,115],ohp:[22,45],barbell_row:[35,65],
 rdl:[40,80],leg_press:[90,160],lat_pulldown:[35,60],seated_row:[35,60],db_press:[16,30],incline_db:[14,28],
 db_shoulder:[10,22],lat_raise:[6,12],face_pull:[15,28],bb_curl:[15,30],db_curl:[8,16],hammer:[8,16],
 tricep_pushdown:[20,35],overhead_ext:[12,25],cable_fly:[12,22],leg_curl:[25,45],leg_ext:[30,50],
 calf_raise:[40,80],hip_thrust:[50,100],bulgarian:[10,20],goblet_squat:[16,28],preacher:[12,25],
 skullcrusher:[15,30],close_grip:[30,60],upright_row:[15,30],rear_delt:[7,14],front_squat:[30,60],
 machine_press:[30,55],kb_swing:[12,24],power_clean:[30,55],thruster:[20,40],farmers:[20,35],
 kb_goblet:[12,24],kb_deadlift:[16,32],kb_press:[8,16],kb_row:[12,24],cable_woodchop:[10,20],cable_pullthrough:[25,45]};
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function buildDemo(){
  const rnd = mulberry32(20260918);
  PIDS.forEach((pid,pi)=>{
    const p = state.profiles[pid], t = computeTargets(p);
    state.days[pid] = {};
    for(let back=29; back>=0; back--){
      const date = addDays(todayISO(), -back), dw = dowOf(date);
      const day = blankDay(date);
      /* food: the day's meal plan, portions jittered a little */
      const mp = p.mealPlan[dw] || {};
      MEALS.forEach(([m])=>{
        (mp[m]||[]).forEach(fid=>{
          const f = foodById(fid); if(!f) return;
          const mult = 0.8 + rnd()*0.6;
          day.meals[m].push({id:uid(), foodId:fid, grams:Math.round(f.servG*mult/5)*5||f.servG});
        });
      });
      if(rnd()<0.28) day.meals.snack.push({id:uid(), foodId: rnd()<0.5?"dark_choc":"chai", grams: rnd()<0.5?20:150});
      /* land the day near the calorie target so the example reads like a real log */
      const raw = dayTotals(day).kcal;
      if(raw>0 && t.kcal>0){
        const factor = t.kcal*(0.88+rnd()*0.14)/raw;
        MEALS.forEach(([m])=> day.meals[m].forEach(e=>{ e.grams = Math.max(5, Math.round(e.grams*factor/5)*5); }));
      }
      /* training: follow the plan, skip roughly one extra day a week */
      const plan = p.plan[dw];
      const skip = plan.items.length===0 || rnd()<0.18;
      if(!skip){
        day.workout.name = plan.name;
        plan.items.forEach(it=>{
          const ex = exById(it.exId); if(!ex) return;
          if(ex.type==="cardio"){
            const mins = it.mins || 20;
            day.workout.cardio.push({id:uid(), exId:it.exId, minutes:mins, distanceKm: r1(mins*0.16*(0.85+rnd()*0.3)), kcal:cardioKcal(it.exId,mins,p.weightKg)});
            return;
          }
          const load = DEMO_LOAD[it.exId] ? DEMO_LOAD[it.exId][pi] : (BODYWEIGHT_EX.has(it.exId) ? Math.round(p.weightKg) : 20);
          const prog = 1 + (29-back)*0.0026;
          const sets = [];
          for(let s=0;s<(it.sets||3);s++){
            const w = Math.round(load*prog/2.5)*2.5;
            const reps = Math.max(1,(it.reps||8) - (s>1 && rnd()<0.45 ? 1 : 0));
            sets.push({reps, weight:w, done:true});
          }
          day.workout.exercises.push({id:uid(), exId:it.exId, sets});
        });
      }
      day.water = 5 + Math.round(rnd()*4);
      if(back%2===0) day.weightKg = r1(p.weightKg + (back/29)*(p.goal==="cut"?1.8:-0.5) + (rnd()-0.5)*0.4);
      day.steps = 4000 + Math.round(rnd()*7000);
      state.days[pid][date] = day;
    }
  });
  state.demo = true;
}
function clearDemo(){
  if(!state.demo) return;
  state.demo = false;
  PIDS.forEach(p=> state.days[p] = {});
  toast("Examples cleared — this is your log now.");
}

/* ============================ boot ============================ */
async function boot(){
  let db = null;
  try{ if(window.claude && window.claude.use) db = await claude.use("db"); }catch(e){ db = null; }
  Persist.db = db;
  if(!db){
    if(!localLoad()) buildDemo();
    state.loaded = true; render();
    return;
  }
  let firstSnaps = 0;
  const arrived = ()=>{ firstSnaps++; if(firstSnaps>=6 && !state.loaded){
      state.loaded = true; if(!hasAnyData()) buildDemo(); }
    if(state.loaded) render(); };
  const onErr = e => { if(e && e.code) console.warn("db", e.code); arrived(); };
  try{
    db.doc("config/app").onSnapshot(s=>{ const d=s.exists&&s.data();
      if(d){ if(d.units) state.units=d.units; if(d.active) state.active=d.active; } arrived(); }, onErr);
    db.doc("library/custom").onSnapshot(s=>{ const d=s.exists&&s.data();
      if(d) state.custom={foods:d.foods||[],exercises:d.exercises||[]}; arrived(); }, onErr);
    PIDS.forEach(pid=>{
      db.doc("profiles/"+pid).onSnapshot(s=>{ const d=s.exists&&s.data();
        if(d) state.profiles[pid]=Object.assign(defaultProfile(pid,"","male",30,175,75,"maintain"),d,{id:pid}); arrived(); }, onErr);
      db.collection("profiles/"+pid+"/days").orderBy("date","desc").limit(240).onSnapshot(s=>{
        const bag={}; s.docs.forEach(doc=>{ const d=doc.data(); if(d&&d.date) bag[d.date]=normaliseDay(d); });
        if(!state.demo) state.days[pid]=bag;
        arrived();
      }, onErr);
    });
  }catch(e){ console.warn(e); if(!state.loaded){ state.loaded=true; buildDemo(); render(); } }
  setTimeout(()=>{ if(!state.loaded){ state.loaded=true; if(!hasAnyData()) buildDemo(); render(); } }, 4000);
  render();
}
function normaliseDay(d){
  const b = blankDay(d.date);
  b.meals = Object.assign(b.meals, d.meals||{});
  MEALS.forEach(([m])=>{ if(!Array.isArray(b.meals[m])) b.meals[m]=[]; });
  b.workout = Object.assign({name:"",exercises:[],cardio:[],notes:""}, d.workout||{});
  if(!Array.isArray(b.workout.exercises)) b.workout.exercises=[];
  if(!Array.isArray(b.workout.cardio)) b.workout.cardio=[];
  b.water = d.water||0; b.weightKg = d.weightKg??null; b.steps = d.steps??null;
  return b;
}
/* Any change to the log retires the example data first. */
function mutate(fn){ clearDemo(); fn(); render(); }
</script>

<script>
/* ============================ shared UI pieces ============================ */
function ringSvg(kcal, target){
  const R=50, SW=11, C=2*Math.PI*R;
  const pct = target>0 ? kcal/target : 0;
  const shown = clamp(pct,0,1);
  const over = pct>1.02;
  return el("div",{class:"ring-wrap"},[
    svgEl("svg",{viewBox:"0 0 120 120",width:"118",height:"118","aria-hidden":"true"},[
      svgEl("circle",{cx:60,cy:60,r:R,fill:"none",stroke:"var(--card-2)","stroke-width":SW}),
      svgEl("circle",{cx:60,cy:60,r:R,fill:"none",stroke:over?"var(--critical)":"var(--moss-deep)","stroke-width":SW,
        "stroke-linecap":"round","stroke-dasharray":(C*shown)+" "+C,transform:"rotate(-90 60 60)"})
    ]),
    el("div",{class:"ring-center"},[
      el("div",{class:"big",text:r0(kcal)}),
      el("div",{class:"sub",text:target>0?("of "+r0(target)):"kcal"})
    ])
  ]);
}
function svgEl(t,a,kids){
  const n=document.createElementNS("http://www.w3.org/2000/svg",t);
  if(a) for(const k in a){ if(k.startsWith("on")) n.addEventListener(k.slice(2),a[k]);
    else if(a[k]!==null&&a[k]!==undefined&&a[k]!==false) n.setAttribute(k,String(a[k])); }
  if(kids) (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c) n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}
/* Protein and fibre targets are floors — clearing them is the win. Carbs and fat are ceilings. */
function macroBar(label, color, got, target, kind, unit){
  const pct = target>0 ? clamp(got/target,0,1) : 0;
  const ceiling = kind!=="floor";
  const over = ceiling && target>0 && got>target*1.02;
  const met = !ceiling && target>0 && got>=target;
  return el("div",{class:"macro-row"},[
    el("div",{class:"lbl"},[ el("i",{class:"swatch",style:"background:"+color}), label ]),
    el("div",{class:"bar"},[ el("i",{style:"width:"+(pct*100).toFixed(1)+"%;background:"+(over?"var(--critical)":color)}) ]),
    el("div",{class:"val",style: over?"color:var(--critical)": met?"color:var(--good)":""},[
      el("b",{text:r0(got)}), " / "+r0(target)+" "+(unit||"g"), met? " ✓" : "" ])
  ]);
}
function confirmThen(msg, fn){ if(window.confirm(msg)) fn(); }

/* ============================ header ============================ */
function renderHeader(){
  const people = $("#people"); people.innerHTML="";
  PIDS.forEach(pid=>{
    const p = state.profiles[pid];
    people.appendChild(el("button",{class:"person-btn","aria-pressed":String(!state.compare && state.active===pid),
      onclick:()=>{ state.compare=false; state.active=pid; save("config"); render(); }},[
      el("span",{class:"dot",style:"background:"+PUI[pid]}),
      el("span",{text:p.name||pid})
    ]));
  });
  people.appendChild(el("button",{class:"person-btn both","aria-pressed":String(state.compare),
    onclick:()=>{ state.compare=true; render(); },text:"Both"}));

  $("#dateText").textContent = fmtDate(state.date);
  $("#dateDow").textContent = state.date===todayISO() ? "today" : DOW_LABEL[dowOf(state.date)].slice(0,3);
  $("#datePick").value = state.date;

  const banner = $("#banner"); banner.innerHTML="";
  if(state.demo){
    banner.appendChild(el("div",{class:"banner"},[
      el("span",{html:"<strong>Example data.</strong> Three weeks of a sample log, so you can see every screen working. Your first entry replaces it."}),
      el("span",{class:"spacer"}),
      el("button",{class:"btn btn-sm",onclick:()=>{ clearDemo(); render(); },text:"Start my log"})
    ]));
  } else if(!Persist.db){
    banner.appendChild(el("div",{class:"banner"},[
      el("span",{html:"Saving to <strong>this browser only</strong>. Export a backup from Settings if you clear site data."})
    ]));
  }
}

/* ============================ today ============================ */
function renderToday(){
  const root = $("#view-today"); root.innerHTML="";
  if(state.compare){ renderCompare(root); return; }
  const pid = state.active, p = state.profiles[pid], t = computeTargets(p);
  const day = getDay(pid, state.date);
  const tot = dayTotals(day), ws = workoutStats(day);
  const grid = el("div",{class:"grid2"});
  grid.appendChild(fuelColumn(pid,p,t,day,tot,ws));
  grid.appendChild(ironColumn(pid,p,day,ws));
  root.appendChild(grid);
}
function fuelColumn(pid,p,t,day,tot,ws){
  const left = el("div",{class:"stack"});
  const remaining = t.kcal - tot.kcal + (ws.cardioKcal||0);
  const fuel = el("div",{class:"card"});
  fuel.appendChild(el("div",{class:"card-h"},[
    el("h2",{text:"Fuel"}),
    el("span",{class:"num",style:"font-size:12.5px;color:"+(remaining<0?"var(--critical)":"var(--muted)"),
      text:(remaining>=0? r0(remaining)+" kcal left" : r0(-remaining)+" kcal over")})
  ]));
  fuel.appendChild(el("div",{class:"card-b"},[
    el("div",{class:"fuel-top"},[
      ringSvg(tot.kcal, t.kcal),
      el("div",{class:"macros"},[
        macroBar("Protein","var(--s1)",tot.p,t.p,"floor"),
        macroBar("Carbs","var(--s2)",tot.c,t.c,"ceiling"),
        macroBar("Fat","var(--s3)",tot.f,t.f,"ceiling"),
        macroBar("Fibre","var(--moss)",tot.fib,t.fib,"floor")
      ])
    ])
  ]));
  MEALS.forEach(([m,label])=>{
    const mt = mealTotals(day,m);
    const sec = el("div",{class:"meal"});
    sec.appendChild(el("div",{class:"meal-h"},[
      el("span",{class:"name",text:label}),
      el("span",{class:"kcal",text:r0(mt.kcal)+" kcal"})
    ]));
    const list = day.meals[m]||[];
    if(!list.length) sec.appendChild(el("div",{class:"empty",text:"Nothing logged"}));
    list.forEach(e=>{
      const x = entryMacros(e);
      const f = e.custom ? {name:e.custom.name} : foodById(e.foodId);
      sec.appendChild(el("div",{class:"entry"},[
        el("div",{},[ el("div",{class:"nm",text:(f&&f.name)||"Unknown"}),
                      el("div",{class:"qty",text: e.custom? "one-off" : (e.grams+" g")}) ]),
        el("div",{class:"mac",text:"P "+r0(x.p)+" · C "+r0(x.c)+" · F "+r0(x.f)}),
        el("div",{style:"display:flex;align-items:center;gap:4px"},[
          el("span",{class:"kc",text:r0(x.kcal)}),
          el("button",{class:"btn btn-sm btn-ghost",title:"Remove","aria-label":"Remove "+((f&&f.name)||"entry"),
            onclick:()=>mutate(()=>{ const d=getDay(pid,state.date,true);
              d.meals[m]=d.meals[m].filter(y=>y.id!==e.id); save("day|"+pid+"|"+state.date); }),text:"×"})
        ])
      ]));
    });
    sec.appendChild(el("div",{class:"add-row"},[
      el("div",{class:"btn-row"},[
        el("button",{class:"btn btn-sm",onclick:()=>openFoodPicker(pid,m),text:"+ Add food"}),
        el("button",{class:"btn btn-sm btn-ghost",onclick:()=>copyPlannedMeal(pid,m),text:"Use plan"})
      ])
    ]));
    fuel.appendChild(sec);
  });
  left.appendChild(fuel);

  /* body metrics */
  const body = el("div",{class:"card"});
  body.appendChild(el("div",{class:"card-h"},[el("h2",{text:"Body"})]));
  const waterRow = el("div",{class:"water"});
  const wTarget = t.water||8;
  for(let i=0;i<Math.max(wTarget,day.water);i++){
    waterRow.appendChild(el("button",{class:"glass"+(i<day.water?" on":""),"aria-label":"Water glass "+(i+1),
      onclick:()=>mutate(()=>{ const d=getDay(pid,state.date,true);
        d.water = (i+1===d.water) ? i : i+1; save("day|"+pid+"|"+state.date); })}));
  }
  body.appendChild(el("div",{class:"card-b"},[
    el("div",{class:"fields"},[
      el("div",{class:"field"},[ el("label",{for:"wt-"+pid,text:"Body weight ("+(state.units==="metric"?"kg":"lb")+")"}),
        el("input",{id:"wt-"+pid,class:"inp",type:"number",step:"0.1",inputmode:"decimal",
          value: day.weightKg==null?"":(state.units==="metric"? day.weightKg : r1(day.weightKg/KG_PER_LB)),
          onchange:ev=>mutate(()=>{ const d=getDay(pid,state.date,true); const v=parseFloat(ev.target.value);
            d.weightKg = isNaN(v)?null:(state.units==="metric"? v : v*KG_PER_LB);
            if(d.weightKg) { state.profiles[pid].weightKg = r1(d.weightKg); save("profile|"+pid); }
            save("day|"+pid+"|"+state.date); })}) ]),
      el("div",{class:"field"},[ el("label",{for:"st-"+pid,text:"Steps (target "+(t.steps||10000).toLocaleString()+")"}),
        el("input",{id:"st-"+pid,class:"inp",type:"number",inputmode:"numeric",value: day.steps==null?"":day.steps,
          onchange:ev=>mutate(()=>{ const d=getDay(pid,state.date,true); const v=parseInt(ev.target.value,10);
            d.steps = isNaN(v)?null:v; save("day|"+pid+"|"+state.date); })}),
        el("div",{class:"bar",style:"margin-top:6px"},[
          el("i",{style:"width:"+(clamp((day.steps||0)/(t.steps||10000),0,1)*100).toFixed(1)+"%;background:var(--moss)"})]) ])
    ]),
    el("div",{style:"margin-top:12px"},[
      el("div",{class:"eyebrow",style:"margin-bottom:5px",text:"Water — "+day.water+" of "+wTarget+" glasses"}),
      waterRow
    ])
  ]));
  left.appendChild(body);
  return left;
}
</script>

<script>
/* ============================ today: training ============================ */
function ironColumn(pid,p,day,ws){
  const right = el("div",{class:"stack"});
  const dw = dowOf(state.date), plan = p.plan[dw] || {name:"Rest",items:[]};
  const card = el("div",{class:"card"});
  card.appendChild(el("div",{class:"card-h"},[
    el("h2",{text:"Iron"}),
    el("input",{class:"inp",style:"max-width:180px",placeholder:"Session name", value:day.workout.name||"",
      "aria-label":"Session name",
      onchange:ev=>mutate(()=>{ const d=getDay(pid,state.date,true); d.workout.name=ev.target.value; save("day|"+pid+"|"+state.date); })}),
    el("button",{class:"btn btn-sm btn-accent",title:"Copy today's planned session into the log",
      onclick:()=>loadPlanIntoDay(pid), text:"Load "+(plan.name||"plan")})
  ]));
  const topSet = Object.entries(ws.best).sort((a,b)=>b[1]-a[1])[0];
  card.appendChild(el("div",{class:"tiles"},[
    el("div",{class:"tile"},[ el("div",{class:"k",text:r0(ws.volume).toLocaleString()}), el("div",{class:"l",text:"kg volume"}) ]),
    el("div",{class:"tile"},[ el("div",{class:"k",text:ws.sets}), el("div",{class:"l",text:"working sets"}) ]),
    el("div",{class:"tile"},[ el("div",{class:"k",text:ws.cardioMin?ws.cardioMin+"′":"—"}), el("div",{class:"l",text:"cardio"}),
      ws.cardioKcal? el("div",{class:"d",style:"color:var(--muted)",text:"~"+r0(ws.cardioKcal)+" kcal"}) : null ]),
    el("div",{class:"tile"},[ el("div",{class:"k",text: topSet? r0(topSet[1])+"" : "—"}),
      el("div",{class:"l",text: topSet? "top e1RM" : "no lift yet"}),
      topSet? el("div",{class:"d",style:"color:var(--muted)",text:(exById(topSet[0])||{}).name}) : null ])
  ]));

  if(!day.workout.exercises.length && !day.workout.cardio.length){
    card.appendChild(el("div",{class:"empty",style:"padding:14px 16px"},
      plan.items.length ? "Today's plan is "+plan.name+". Load it, or add exercises freely." : "Rest day in the plan. Add anything you do anyway."));
  }

  day.workout.exercises.forEach(ex=>{
    const meta = exById(ex.exId) || {name:ex.exId, group:"Other"};
    const planned = (plan.items||[]).find(i=>i.exId===ex.exId);
    let vol=0, best=0;
    ex.sets.forEach(s=>{ if(s.done){ vol += (+s.weight||0)*(+s.reps||0); best=Math.max(best,e1rm(+s.weight||0,+s.reps||0)); } });
    const prev = historicBest(pid, ex.exId, state.date);
    const isPR = best>0 && best>prev+0.01;
    const block = el("div",{class:"ex"});
    block.appendChild(el("div",{class:"ex-h"},[
      el("span",{class:"nm",text:meta.name}),
      el("span",{class:"tag tag-moss",text:meta.group}),
      isPR? el("span",{class:"tag tag-coral",text:"PR "+r1(best)+" kg"}) : null,
      el("span",{class:"vol",text: vol? r0(vol)+" kg" : ""}),
      el("button",{class:"btn btn-sm btn-ghost",title:"Remove exercise","aria-label":"Remove "+meta.name,
        onclick:()=>mutate(()=>{ const d=getDay(pid,state.date,true);
          d.workout.exercises=d.workout.exercises.filter(y=>y.id!==ex.id); save("day|"+pid+"|"+state.date); }),text:"×"})
    ]));
    if(planned) block.appendChild(el("div",{class:"planned",style:"margin:-4px 0 7px",
      text:"Plan: "+planned.sets+" × "+planned.reps}));
    const sets = el("div",{class:"sets"});
    ex.sets.forEach((s,i)=>{
      sets.appendChild(el("div",{class:"setrow"},[
        el("span",{class:"idx",text:i+1}),
        el("input",{class:"inp",type:"number",inputmode:"numeric",placeholder:"reps",value:s.reps??"","aria-label":"Set "+(i+1)+" reps",
          onchange:ev=>mutate(()=>{ const d=getDay(pid,state.date,true);
            const e2=d.workout.exercises.find(y=>y.id===ex.id); if(e2){ e2.sets[i].reps=parseInt(ev.target.value,10)||0;
              save("day|"+pid+"|"+state.date);} })}),
        el("input",{class:"inp",type:"number",step:"0.5",inputmode:"decimal",placeholder:"kg",value:s.weight??"","aria-label":"Set "+(i+1)+" weight",
          onchange:ev=>mutate(()=>{ const d=getDay(pid,state.date,true);
            const e2=d.workout.exercises.find(y=>y.id===ex.id); if(e2){ e2.sets[i].weight=parseFloat(ev.target.value)||0;
              save("day|"+pid+"|"+state.date);} })}),
        el("button",{class:"chk","aria-pressed":String(!!s.done),"aria-label":"Mark set "+(i+1)+" done",
          onclick:()=>mutate(()=>{ const d=getDay(pid,state.date,true);
            const e2=d.workout.exercises.find(y=>y.id===ex.id); if(e2){ e2.sets[i].done=!e2.sets[i].done;
              save("day|"+pid+"|"+state.date);} }),text:"✓"}),
        el("button",{class:"btn btn-sm btn-ghost","aria-label":"Delete set "+(i+1),
          onclick:()=>mutate(()=>{ const d=getDay(pid,state.date,true);
            const e2=d.workout.exercises.find(y=>y.id===ex.id); if(e2){ e2.sets.splice(i,1); save("day|"+pid+"|"+state.date);} }),text:"×"})
      ]));
    });
    block.appendChild(sets);
    block.appendChild(el("div",{style:"margin-top:7px"},[
      el("button",{class:"btn btn-sm",onclick:()=>mutate(()=>{ const d=getDay(pid,state.date,true);
        const e2=d.workout.exercises.find(y=>y.id===ex.id); if(e2){ const last=e2.sets[e2.sets.length-1]||{reps:8,weight:0};
          e2.sets.push({reps:last.reps,weight:last.weight,done:false}); save("day|"+pid+"|"+state.date);} }),text:"+ Set"})
    ]));
    card.appendChild(block);
  });

  day.workout.cardio.forEach(c=>{
    const meta = exById(c.exId)||{name:c.exId};
    card.appendChild(el("div",{class:"ex"},[
      el("div",{class:"ex-h"},[
        el("span",{class:"nm",text:meta.name}),
        el("span",{class:"tag tag-teal",text:"Cardio"}),
        el("span",{class:"vol",text:(c.minutes||0)+" min · "+(c.distanceKm?r1(c.distanceKm)+" km · ":"")+r0(c.kcal||0)+" kcal"}),
        el("button",{class:"btn btn-sm btn-ghost","aria-label":"Remove "+meta.name,
          onclick:()=>mutate(()=>{ const d=getDay(pid,state.date,true);
            d.workout.cardio=d.workout.cardio.filter(y=>y.id!==c.id); save("day|"+pid+"|"+state.date); }),text:"×"})
      ])
    ]));
  });

  card.appendChild(el("div",{class:"add-row"},[
    el("div",{class:"btn-row"},[
      el("button",{class:"btn btn-sm",onclick:()=>openExercisePicker(pid),text:"+ Exercise"}),
      el("button",{class:"btn btn-sm",onclick:()=>openCardioDialog(pid),text:"+ Cardio"}),
      el("button",{class:"btn btn-sm btn-ghost",onclick:()=>repeatLastSession(pid),text:"Repeat last session"})
    ]),
    el("textarea",{class:"inp",rows:"2",style:"margin-top:9px;font-family:inherit",placeholder:"Session notes — how it felt, RPE, niggles",
      "aria-label":"Session notes",
      onchange:ev=>mutate(()=>{ const d=getDay(pid,state.date,true); d.workout.notes=ev.target.value; save("day|"+pid+"|"+state.date); })},
      day.workout.notes||"")
  ]));
  right.appendChild(card);
  right.appendChild(plateCard(p));
  return right;
}

/* Bar loading — IWF plate colours in kg, the usual US set in lb. */
function plateCard(p){
  const lb = state.units === "imperial";
  const unit = lb ? "lb" : "kg";
  const PL = lb ? PLATES_LB : PLATES_KG;
  const bars = lb ? [[45,"45 lb bar"],[35,"35 lb bar"],[25,"25 lb bar"],[15,"15 lb bar"]]
                  : [[20,"20 kg bar"],[15,"15 kg bar"],[10,"10 kg bar"],[7,"7 kg bar"]];
  const smallest = PL[PL.length-1][0];
  const card = el("div",{class:"card"});
  const out = el("div",{});
  const compute = (target, bar)=>{
    out.innerHTML="";
    const side = (target - bar)/2;
    if(!isFinite(side) || side < 0){
      out.appendChild(el("div",{class:"note",text:"That is below the bar on its own."})); return; }
    const used=[]; let rest=side;
    PL.forEach(([w,color,h])=>{ while(rest >= w - 0.001){ used.push([w,color,h]); rest -= w; } });
    const row = el("div",{class:"plates"},[ el("span",{class:"bar-stub"}) ]);
    used.forEach(([w,color,h])=> row.appendChild(el("span",{class:"plate",
      style:"width:15px;height:"+h+"px;background:"+color+";color:"+(color==="var(--plate-d)"||color==="var(--plate-f)"?"#222":"#fff"),
      text:String(w).replace(/\.0$/,"")})));
    out.appendChild(row);
    out.appendChild(el("div",{class:"note",style:"margin-top:8px"},[
      used.length ? el("span",{},[ el("strong",{text:"Per side: "}), used.map(u=>u[0]).join(" + ")+" "+unit ])
                  : el("span",{text:"Just the bar."}),
      rest > 0.01 ? el("span",{style:"color:var(--coral)",
        text:"  ·  "+r1(rest)+" "+unit+" short — nearest is "+r1(target-rest*2)+" "+unit}) : null,
      el("div",{class:"eyebrow",style:"margin-top:8px",
        text:"smallest pair on hand: "+smallest+" "+unit+" → "+(smallest*2)+" "+unit+" jumps"})
    ]));
  };
  card.appendChild(el("div",{class:"card-h"},[el("h2",{text:"Bar loading"}),
    el("span",{class:"eyebrow",text:unit})]));
  const tIn = el("input",{class:"inp",type:"number",step: lb?"5":"2.5",value: lb?135:60,"aria-label":"Target weight"});
  const bIn = el("select",{class:"inp","aria-label":"Bar weight"}, bars.map(([v,l])=>el("option",{value:v,text:l})));
  const run = ()=>compute(parseFloat(tIn.value)||0, parseFloat(bIn.value)|| bars[0][0]);
  tIn.addEventListener("input",run); bIn.addEventListener("change",run);
  card.appendChild(el("div",{class:"card-b"},[
    el("div",{class:"fields",style:"margin-bottom:14px"},[
      el("div",{class:"field"},[el("label",{text:"Target ("+unit+")"}),tIn]),
      el("div",{class:"field"},[el("label",{text:"Bar"}),bIn])
    ]), out
  ]));
  setTimeout(run,0);
  return card;
}

/* ============================ compare ============================ */
function renderCompare(root){
  const day1 = getDay("p1",state.date), day2 = getDay("p2",state.date);
  const grid = el("div",{class:"grid2"});
  PIDS.forEach(pid=>{
    const p = state.profiles[pid], t = computeTargets(p), day = getDay(pid,state.date);
    const tot = dayTotals(day), ws = workoutStats(day);
    const card = el("div",{class:"card "+(pid==="p1"?"coral":"teal")});
    card.appendChild(el("div",{class:"card-h"},[
      el("div",{},[ el("h2",{text:p.name}), el("div",{class:"eyebrow",style:"margin-top:2px",text:statLine(p)}) ]),
      el("span",{style:"margin-left:auto"}),
      el("button",{class:"btn btn-sm",onclick:()=>{ state.compare=false; state.active=pid; render(); },text:"Open"})
    ]));
    card.appendChild(el("div",{class:"card-b"},[
      el("div",{class:"fuel-top"},[ ringSvg(tot.kcal,t.kcal),
        el("div",{class:"macros"},[
          macroBar("Protein","var(--s1)",tot.p,t.p,"floor"),
          macroBar("Carbs","var(--s2)",tot.c,t.c,"ceiling"),
          macroBar("Fat","var(--s3)",tot.f,t.f,"ceiling")
        ])])
    ]));
    card.appendChild(el("div",{class:"tiles"},[
      el("div",{class:"tile"},[el("div",{class:"k",text:day.workout.name||"—"}),el("div",{class:"l",text:"session"})]),
      el("div",{class:"tile"},[el("div",{class:"k",text:r0(ws.volume).toLocaleString()}),el("div",{class:"l",text:"kg volume"})]),
      el("div",{class:"tile"},[el("div",{class:"k",text:ws.sets}),el("div",{class:"l",text:"sets"})]),
      el("div",{class:"tile"},[el("div",{class:"k",text:day.weightKg?r1(day.weightKg):"—"}),el("div",{class:"l",text:"body weight kg"})])
    ]));
    grid.appendChild(card);
  });
  root.appendChild(grid);
  const both = el("div",{class:"card",style:"margin-top:16px"});
  both.appendChild(el("div",{class:"card-h"},[el("h2",{text:"Side by side"}),
    el("span",{class:"eyebrow",text:fmtDate(state.date)})]));
  const rows = [
    ["Calories", d=>r0(dayTotals(d).kcal)], ["Protein (g)", d=>r0(dayTotals(d).p)],
    ["Carbs (g)", d=>r0(dayTotals(d).c)], ["Fat (g)", d=>r0(dayTotals(d).f)],
    ["Fibre (g)", d=>r0(dayTotals(d).fib)], ["Training volume (kg)", d=>r0(workoutStats(d).volume)],
    ["Working sets", d=>workoutStats(d).sets], ["Cardio (min)", d=>workoutStats(d).cardioMin],
    ["Water (glasses)", d=>d.water||0], ["Steps", d=>d.steps||0]
  ];
  const tbody = el("tbody",{});
  rows.forEach(([label,fn])=> tbody.appendChild(el("tr",{},[
    el("td",{text:label}), el("td",{class:"n",text:String(fn(day1))}), el("td",{class:"n",text:String(fn(day2))})])));
  both.appendChild(el("div",{class:"tbl-wrap"},[ el("table",{},[
    el("thead",{},[el("tr",{},[el("th",{text:"Metric"}),el("th",{class:"n",text:state.profiles.p1.name}),el("th",{class:"n",text:state.profiles.p2.name})])]),
    tbody ])]));
  root.appendChild(both);
}
</script>

<script>
/* ============================ modals ============================ */
let lastFocus=null;
function openModal(title, body, foot){
  lastFocus = document.activeElement;
  const root=$("#modalRoot"); root.innerHTML="";
  const scrim = el("div",{class:"scrim",onclick:ev=>{ if(ev.target===scrim) closeModal(); }});
  const modal = el("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":title},[
    el("div",{class:"modal-h"},[ el("h2",{text:title}),
      el("button",{class:"btn btn-sm btn-ghost",onclick:closeModal,"aria-label":"Close",text:"×"}) ]),
    el("div",{class:"modal-b"}, body),
    foot? el("div",{class:"modal-f"}, foot) : null
  ]);
  scrim.appendChild(modal); root.appendChild(scrim);
  const first = modal.querySelector("input,select,button.res,textarea"); if(first) first.focus();
  return modal;
}
function closeModal(){ $("#modalRoot").innerHTML=""; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ---- food picker ---- */
function openFoodPicker(pid, meal){
  const results = el("div",{class:"results"});
  const search = el("input",{class:"inp",type:"search",placeholder:"Search 80+ foods — chicken, roti, oats…","aria-label":"Search foods"});
  const detail = el("div",{});
  const list = ()=>{
    const q = search.value.trim().toLowerCase();
    results.innerHTML="";
    const items = allFoods().filter(f=> !q || f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q)).slice(0,60);
    if(!items.length){ results.appendChild(el("div",{class:"empty",text:"No match. Use “One-off entry” below."})); return; }
    items.forEach(f=> results.appendChild(el("button",{class:"res",onclick:()=>choose(f)},[
      el("div",{},[ el("div",{class:"nm",text:f.name}),
        el("div",{class:"meta",text:f.cat+" · P"+r1(f.p)+" C"+r1(f.c)+" F"+r1(f.f)+" per 100 g"}) ]),
      el("div",{class:"kc",text:r0(f.kcal)+" kcal"})
    ])));
  };
  const choose = (f)=>{
    detail.innerHTML="";
    const g = el("input",{class:"inp",type:"number",step:"1",inputmode:"numeric",value:f.servG||100,"aria-label":"Grams"});
    const preview = el("div",{class:"note"});
    const upd = ()=>{ const grams=parseFloat(g.value)||0, k=grams/100;
      preview.textContent = r0(f.kcal*k)+" kcal · P "+r1(f.p*k)+" · C "+r1(f.c*k)+" · F "+r1(f.f*k)+" · Fibre "+r1((f.fib||0)*k); };
    g.addEventListener("input",upd); upd();
    const chips = el("div",{class:"btn-row"});
    [[0.5,"½ "+f.servLabel],[1,f.servLabel],[1.5,"1½ "+f.servLabel],[2,"2 × "+f.servLabel]].forEach(([m,lab])=>
      chips.appendChild(el("button",{class:"btn btn-sm",onclick:()=>{ g.value=Math.round((f.servG||100)*m); upd(); },text:lab})));
    detail.appendChild(el("div",{class:"card",style:"border-radius:var(--r-m)"},[
      el("div",{class:"card-b"},[
        el("div",{style:"font-weight:700;margin-bottom:8px",text:f.name}),
        chips,
        el("div",{class:"field",style:"margin-top:10px"},[el("label",{text:"Grams"}),g]),
        el("div",{style:"margin-top:8px"},[preview]),
        el("div",{class:"btn-row",style:"margin-top:11px"},[
          el("button",{class:"btn btn-accent",onclick:()=>{
            mutate(()=>{ const d=getDay(pid,state.date,true);
              d.meals[meal].push({id:uid(), foodId:f.id, grams:parseFloat(g.value)||0});
              save("day|"+pid+"|"+state.date); });
            closeModal(); toast(f.name+" added");
          },text:"Add to "+meal}),
          el("button",{class:"btn",onclick:()=>{ detail.innerHTML=""; search.focus(); },text:"Back"})
        ])
      ])
    ]));
    detail.scrollIntoView({block:"nearest"});
  };
  search.addEventListener("input",list); list();
  openModal("Add food", [search, detail, results,
    el("button",{class:"btn",onclick:()=>openCustomEntry(pid,meal),text:"One-off entry (type the macros)"})]);
}
function openCustomEntry(pid, meal){
  const f = {};
  const mk=(k,lab,ph)=>{ const i=el("input",{class:"inp",type:k==="name"?"text":"number",step:"0.1",placeholder:ph||"",
    "aria-label":lab}); f[k]=i; return el("div",{class:"field"},[el("label",{text:lab}),i]); };
  const body = [ mk("name","What was it","Restaurant thali"),
    el("div",{class:"fields"},[mk("kcal","Calories"),mk("p","Protein g"),mk("c","Carbs g"),mk("f","Fat g")]) ];
  openModal("One-off entry", body, [
    el("button",{class:"btn",onclick:closeModal,text:"Cancel"}),
    el("button",{class:"btn btn-accent",onclick:()=>{
      const name=f.name.value.trim()||"One-off entry";
      mutate(()=>{ const d=getDay(pid,state.date,true);
        d.meals[meal].push({id:uid(), custom:{name, kcal:+f.kcal.value||0, p:+f.p.value||0, c:+f.c.value||0, f:+f.f.value||0, fib:0}});
        save("day|"+pid+"|"+state.date); });
      closeModal(); toast("Added");
    },text:"Add"})]);
}

/* ---- exercise picker ---- */
function lastLoadFor(pid, exId){
  const bag = state.days[pid]||{};
  const dates = Object.keys(bag).filter(d=>d<state.date).sort().reverse();
  for(const d of dates){
    const ex = (bag[d].workout.exercises||[]).find(e=>e.exId===exId);
    if(ex && ex.sets && ex.sets.length) return ex.sets.map(s=>({reps:s.reps,weight:s.weight,done:false}));
  }
  return null;
}
function openExercisePicker(pid){
  const results = el("div",{class:"results"});
  const search = el("input",{class:"inp",type:"search",placeholder:"Search exercises","aria-label":"Search exercises"});
  let group = "All";
  const seg = el("div",{class:"seg",style:"flex-wrap:wrap"});
  ["All"].concat(GROUPS).forEach(g=> seg.appendChild(el("button",{"aria-pressed":String(g===group),
    onclick:ev=>{ group=g; [...seg.children].forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===g))); list(); },text:g})));
  const add = (x)=>{
    mutate(()=>{ const d=getDay(pid,state.date,true);
      if(x.type==="cardio"){ const mins=20;
        d.workout.cardio.push({id:uid(),exId:x.id,minutes:mins,distanceKm:null,kcal:cardioKcal(x.id,mins,state.profiles[pid].weightKg)});
      } else {
        const sets = lastLoadFor(pid,x.id) || [{reps:8,weight:0,done:false},{reps:8,weight:0,done:false},{reps:8,weight:0,done:false}];
        d.workout.exercises.push({id:uid(), exId:x.id, sets});
      }
      if(!d.workout.name){ const pl=state.profiles[pid].plan[dowOf(state.date)]; d.workout.name = (pl&&pl.name)||"Session"; }
      save("day|"+pid+"|"+state.date); });
    closeModal(); toast(x.name+" added");
  };
  const list = ()=>{
    const q = search.value.trim().toLowerCase(); results.innerHTML="";
    const items = allExercises().filter(x=> (group==="All"||x.group===group) && (!q||x.name.toLowerCase().includes(q))).slice(0,80);
    if(!items.length){ results.appendChild(el("div",{class:"empty",text:"No match — add it in Library."})); return; }
    items.forEach(x=>{
      const prev = lastLoadFor(pid,x.id);
      results.appendChild(el("button",{class:"res",onclick:()=>add(x)},[
        el("div",{},[ el("div",{class:"nm",text:x.name}), el("div",{class:"meta",text:x.group}) ]),
        el("div",{class:"kc",text: prev? ("last "+prev.length+"×"+prev[0].reps+" @ "+r1(prev[0].weight)+"kg") : x.type==="cardio"?"cardio":"new"})
      ]));
    });
  };
  search.addEventListener("input",list); list();
  openModal("Add exercise",[search, seg, results]);
}
function openCardioDialog(pid){
  const p = state.profiles[pid];
  const sel = el("select",{class:"inp","aria-label":"Cardio type"},
    allExercises().filter(x=>x.type==="cardio").map(x=>el("option",{value:x.id,text:x.name})));
  const mins = el("input",{class:"inp",type:"number",value:30,"aria-label":"Minutes"});
  const dist = el("input",{class:"inp",type:"number",step:"0.1",placeholder:"optional","aria-label":"Distance km"});
  const kc = el("input",{class:"inp",type:"number","aria-label":"Calories"});
  const sync = ()=>{ kc.value = cardioKcal(sel.value, parseFloat(mins.value)||0, p.weightKg); };
  sel.addEventListener("change",sync); mins.addEventListener("input",sync); sync();
  openModal("Log cardio",[ el("div",{class:"field"},[el("label",{text:"Type"}),sel]),
    el("div",{class:"fields"},[
      el("div",{class:"field"},[el("label",{text:"Minutes"}),mins]),
      el("div",{class:"field"},[el("label",{text:"Distance (km)"}),dist]),
      el("div",{class:"field"},[el("label",{text:"Calories (estimated)"}),kc])]),
    el("div",{class:"note",text:"Estimate uses the activity's MET value and "+r1(p.weightKg)+" kg body weight. Overwrite it if your watch says otherwise."})
  ],[ el("button",{class:"btn",onclick:closeModal,text:"Cancel"}),
      el("button",{class:"btn btn-accent",onclick:()=>{
        mutate(()=>{ const d=getDay(pid,state.date,true);
          d.workout.cardio.push({id:uid(),exId:sel.value,minutes:parseFloat(mins.value)||0,
            distanceKm:parseFloat(dist.value)||null,kcal:parseFloat(kc.value)||0});
          save("day|"+pid+"|"+state.date); });
        closeModal(); toast("Cardio logged");
      },text:"Log"})]);
}

/* ---- plan → log ---- */
function loadPlanIntoDay(pid){
  const p = state.profiles[pid], plan = p.plan[dowOf(state.date)];
  if(!plan || !plan.items.length){ toast("Nothing planned for this day"); return; }
  mutate(()=>{
    const d = getDay(pid,state.date,true);
    d.workout.name = plan.name;
    plan.items.forEach(it=>{
      const x = exById(it.exId); if(!x) return;
      if(x.type==="cardio"){
        if(d.workout.cardio.some(c=>c.exId===it.exId)) return;
        const mins = it.mins||20;
        d.workout.cardio.push({id:uid(),exId:it.exId,minutes:mins,distanceKm:null,kcal:cardioKcal(it.exId,mins,p.weightKg)});
      } else {
        if(d.workout.exercises.some(e=>e.exId===it.exId)) return;
        const prev = lastLoadFor(pid,it.exId);
        const sets = [];
        for(let i=0;i<(it.sets||3);i++) sets.push({reps: it.reps||8, weight: prev? prev[Math.min(i,prev.length-1)].weight : 0, done:false});
        d.workout.exercises.push({id:uid(), exId:it.exId, sets});
      }
    });
    save("day|"+pid+"|"+state.date);
  });
  toast(plan.name+" loaded");
}
function repeatLastSession(pid){
  const bag = state.days[pid]||{};
  const prevDate = Object.keys(bag).filter(d=>d<state.date && (bag[d].workout.exercises||[]).length).sort().reverse()[0];
  if(!prevDate){ toast("No earlier session to copy"); return; }
  mutate(()=>{
    const src = bag[prevDate], d = getDay(pid,state.date,true);
    d.workout.name = src.workout.name;
    d.workout.exercises = (src.workout.exercises||[]).map(e=>({id:uid(),exId:e.exId,
      sets:(e.sets||[]).map(s=>({reps:s.reps,weight:s.weight,done:false}))}));
    save("day|"+pid+"|"+state.date);
  });
  toast("Copied "+fmtDate(prevDate));
}
function copyPlannedMeal(pid, meal){
  const p = state.profiles[pid];
  const ids = ((p.mealPlan||{})[dowOf(state.date)]||{})[meal]||[];
  if(!ids.length){ toast("No meal planned — set one on the Plan tab"); return; }
  mutate(()=>{
    const d = getDay(pid,state.date,true);
    ids.forEach(fid=>{ const f=foodById(fid); if(f) d.meals[meal].push({id:uid(),foodId:fid,grams:f.servG||100}); });
    save("day|"+pid+"|"+state.date);
  });
  toast("Planned "+meal+" added");
}
</script>

<script>
/* ============================ charts ============================ */
function showTip(ev, title, rows){
  const root=$("#tipRoot"); root.innerHTML="";
  const tip = el("div",{class:"tip"},[ el("div",{class:"t",text:title}) ].concat(
    rows.map(([k,v,c])=> el("div",{class:"r"},[
      c? el("i",{class:"swatch",style:"background:"+c}) : null,
      el("span",{style:"color:var(--muted)",text:k}), el("span",{text:v})]))));
  root.appendChild(tip);
  const r = tip.getBoundingClientRect();
  let x = ev.clientX+14, y = ev.clientY-10;
  if(x + r.width > window.innerWidth-8) x = ev.clientX - r.width - 14;
  if(y + r.height > window.innerHeight-8) y = window.innerHeight - r.height - 8;
  tip.style.left = Math.max(8,x)+"px"; tip.style.top = Math.max(8,y)+"px";
}
function hideTip(){ $("#tipRoot").innerHTML=""; }
function chartWidth(){ const m=$("main"); return Math.max(300,(m?m.clientWidth:640)-34); }
const AX = {left:44, right:14, top:14, bottom:26};

function niceMax(v){ if(v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  const step = [1,1.5,2,2.5,3,4,5,6,8,10].find(x=>n<=x+1e-9) || 10; return step*p; }

function axes(svg,W,H,yMax,ticks,labels){
  for(let i=0;i<=ticks;i++){
    const y = AX.top + (H-AX.top-AX.bottom)*(1-i/ticks);
    svg.appendChild(svgEl("line",{x1:AX.left,x2:W-AX.right,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1}));
    svg.appendChild(svgEl("text",{x:AX.left-7,y:y+3.5,"text-anchor":"end","font-size":10.5,fill:"var(--muted)",
      "font-family":"Space Mono, monospace",class:"num"}, String(r0(yMax*i/ticks))));
  }
  (labels||[]).forEach(([x,txt])=> svg.appendChild(svgEl("text",{x,y:H-8,"text-anchor":"middle","font-size":10,
    fill:"var(--muted)","font-family":"Space Mono, monospace"}, txt)));
}
function xLabels(series,x0,bw,step){
  const out=[]; series.forEach((d,i)=>{ if(i%step===0||i===series.length-1) out.push([x0+bw*i+bw/2, fmtDate(d.date)]); });
  return out;
}

function chartCalories(series, target){
  const W=chartWidth(), H=230, svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:W,height:H,class:"chart",role:"img",
    "aria-label":"Daily calories against target"});
  const yMax = niceMax(Math.max(target*1.25, ...series.map(d=>d.kcal), 1));
  const plotH = H-AX.top-AX.bottom, plotW = W-AX.left-AX.right;
  const bw = plotW/Math.max(series.length,1), bar = Math.max(2,Math.min(22,bw-3));
  axes(svg,W,H,yMax,4,xLabels(series,AX.left,bw,Math.ceil(series.length/6)));
  series.forEach((d,i)=>{
    const h = plotH*(d.kcal/yMax), x = AX.left+bw*i+(bw-bar)/2, y = AX.top+plotH-h;
    const over = target>0 && d.kcal>target*1.05;
    if(h>0) svg.appendChild(svgEl("rect",{x,y,width:bar,height:Math.max(h,1.5),rx:Math.min(4,bar/2),
      fill: over? "var(--critical)" : "var(--s1)"}));
  });
  if(target>0){
    const y = AX.top+plotH*(1-target/yMax);
    svg.appendChild(svgEl("line",{x1:AX.left,x2:W-AX.right,y1:y,y2:y,stroke:"var(--body)","stroke-width":1.5,"stroke-dasharray":"5 4"}));
    svg.appendChild(svgEl("text",{x:W-AX.right,y:y-6,"text-anchor":"end","font-size":10.5,fill:"var(--body)",
      "font-family":"Space Mono, monospace",stroke:"var(--card)","stroke-width":3.5,"paint-order":"stroke fill"},
      "target "+r0(target)));
  }
  series.forEach((d,i)=>{
    const hit = svgEl("rect",{x:AX.left+bw*i,y:AX.top,width:bw,height:plotH,fill:"transparent"});
    hit.addEventListener("mousemove",ev=>showTip(ev, fmtDate(d.date),
      [["Eaten", r0(d.kcal)+" kcal","var(--s1)"],["Target", r0(target)+" kcal"],
       ["Difference",(d.kcal>=target?"+":"")+r0(d.kcal-target)+" kcal"]]));
    hit.addEventListener("mouseleave",hideTip);
    svg.appendChild(hit);
  });
  return svg;
}

function chartMacros(series){
  const W=chartWidth(), H=230, svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:W,height:H,class:"chart",role:"img",
    "aria-label":"Daily protein, carbohydrate and fat in grams"});
  const yMax = niceMax(Math.max(1,...series.map(d=>d.p+d.c+d.f)));
  const plotH=H-AX.top-AX.bottom, plotW=W-AX.left-AX.right;
  const bw=plotW/Math.max(series.length,1), bar=Math.max(2,Math.min(22,bw-3));
  axes(svg,W,H,yMax,4,xLabels(series,AX.left,bw,Math.ceil(series.length/6)));
  const parts=[["p","var(--s1)","Protein"],["c","var(--s2)","Carbs"],["f","var(--s3)","Fat"]];
  series.forEach((d,i)=>{
    let acc=0;
    parts.forEach(([k,color])=>{
      const v=d[k]||0; if(v<=0) return;
      const h=plotH*(v/yMax), y=AX.top+plotH-plotH*((acc+v)/yMax);
      svg.appendChild(svgEl("rect",{x:AX.left+bw*i+(bw-bar)/2,y,width:bar,height:Math.max(h-2,1),rx:2,fill:color}));
      acc+=v;
    });
  });
  series.forEach((d,i)=>{
    const hit=svgEl("rect",{x:AX.left+bw*i,y:AX.top,width:bw,height:plotH,fill:"transparent"});
    hit.addEventListener("mousemove",ev=>showTip(ev,fmtDate(d.date),
      [["Protein",r0(d.p)+" g","var(--s1)"],["Carbs",r0(d.c)+" g","var(--s2)"],["Fat",r0(d.f)+" g","var(--s3)"]]));
    hit.addEventListener("mouseleave",hideTip); svg.appendChild(hit);
  });
  return svg;
}

function chartWeight(sets){
  const W=chartWidth(), H=230, svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:W,height:H,class:"chart",role:"img",
    "aria-label":"Body weight over time"});
  const all = sets.flatMap(s=>s.points);
  if(!all.length) return el("div",{class:"empty",text:"No body-weight entries in this range."});
  const vals = all.map(p=>p.v);
  let lo=Math.min(...vals), hi=Math.max(...vals); const padv=Math.max(0.6,(hi-lo)*0.25); lo-=padv; hi+=padv;
  const plotH=H-AX.top-AX.bottom, plotW=W-AX.left-AX.right;
  const dates = sets[0].domain;
  const xOf = d => AX.left + plotW*(dates.length<2?0.5:(daysBetween(dates[0],d)/(dates.length-1)));
  const yOf = v => AX.top + plotH*(1-(v-lo)/(hi-lo));
  for(let i=0;i<=4;i++){
    const y=AX.top+plotH*(1-i/4), v=lo+(hi-lo)*i/4;
    svg.appendChild(svgEl("line",{x1:AX.left,x2:W-AX.right,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1}));
    svg.appendChild(svgEl("text",{x:AX.left-7,y:y+3.5,"text-anchor":"end","font-size":10.5,fill:"var(--muted)",
      "font-family":"Space Mono, monospace"},r1(v)+""));
  }
  [0,Math.floor(dates.length/2),dates.length-1].forEach(i=> svg.appendChild(
    svgEl("text",{x:xOf(dates[i]),y:H-8,"text-anchor":"middle","font-size":10,fill:"var(--muted)",
      "font-family":"Space Mono, monospace"},fmtDate(dates[i]))));
  sets.forEach(s=>{
    if(!s.points.length) return;
    const d = s.points.map((p,i)=>(i?"L":"M")+xOf(p.d).toFixed(1)+" "+yOf(p.v).toFixed(1)).join(" ");
    svg.appendChild(svgEl("path",{d,fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    const last=s.points[s.points.length-1];
    svg.appendChild(svgEl("circle",{cx:xOf(last.d),cy:yOf(last.v),r:4.5,fill:s.color,stroke:"var(--card)","stroke-width":2}));
    svg.appendChild(svgEl("text",{x:xOf(last.d)-8,y:yOf(last.v)-9,"text-anchor":"end","font-size":11,fill:"var(--ink)",
      "font-family":"Space Mono, monospace","font-weight":700,stroke:"var(--card)","stroke-width":3.5,
      "paint-order":"stroke fill"},r1(last.v)+" "+(state.units==="imperial"?"lb":"kg")));
  });
  const hitLayer = svgEl("g",{});
  dates.forEach((dt,i)=>{
    const x0 = AX.left + plotW*(i-0.5)/Math.max(dates.length-1,1);
    const hit = svgEl("rect",{x:Math.max(AX.left,x0),y:AX.top,width:plotW/Math.max(dates.length-1,1),height:plotH,fill:"transparent"});
    hit.addEventListener("mousemove",ev=>{
      const rows = sets.map(s=>{ const p=s.points.find(q=>q.d===dt); return p? [s.label, r1(p.v)+" kg", s.color] : null; }).filter(Boolean);
      if(rows.length) showTip(ev, fmtDate(dt), rows);
    });
    hit.addEventListener("mouseleave",hideTip); hitLayer.appendChild(hit);
  });
  svg.appendChild(hitLayer);
  return svg;
}

function chartVolumeByGroup(rows){
  if(!rows.length) return el("div",{class:"empty",text:"No strength work logged in this range."});
  const W=chartWidth(), rowH=30, H=rows.length*rowH+16;
  const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:W,height:H,class:"chart",role:"img","aria-label":"Training volume by muscle group"});
  const labelW=84, right=68, max=Math.max(...rows.map(r=>r.v));
  rows.forEach((r,i)=>{
    const y=8+i*rowH, w=(W-labelW-right)*(r.v/max);
    svg.appendChild(svgEl("text",{x:labelW-9,y:y+15,"text-anchor":"end","font-size":11.5,fill:"var(--body)"},r.k));
    svg.appendChild(svgEl("rect",{x:labelW,y:y+3,width:W-labelW-right,height:16,rx:4,fill:"var(--card-2)"}));
    svg.appendChild(svgEl("rect",{x:labelW,y:y+3,width:Math.max(w,2),height:16,rx:4,fill:"var(--seq-5)"}));
    svg.appendChild(svgEl("text",{x:labelW+Math.max(w,2)+8,y:y+15,"font-size":11,fill:"var(--muted)",
      "font-family":"Space Mono, monospace"},r0(r.v).toLocaleString()+" kg"));
  });
  return svg;
}

function chartConsistency(days){
  const W=chartWidth(), cell=Math.max(9,Math.min(16,(W-30)/(Math.ceil(days.length/7)+1)-3));
  const H=7*(cell+3)+22;
  const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:W,height:H,class:"chart",role:"img","aria-label":"Training consistency grid"});
  const max=Math.max(1,...days.map(d=>d.v));
  const steps=["var(--card-2)","var(--seq-2)","var(--seq-3)","var(--seq-4)","var(--seq-6)"];
  const lead = WEEK_ORDER.indexOf(dowOf(days[0].date));
  days.forEach((d,i)=>{
    const col=Math.floor((i+lead)/7), row=WEEK_ORDER.indexOf(dowOf(d.date));
    const idx = d.v<=0?0: 1+Math.min(3,Math.floor((d.v/max)*3.999));
    const rect=svgEl("rect",{x:14+col*(cell+3),y:8+row*(cell+3),width:cell,height:cell,rx:3,fill:steps[idx],
      stroke:"var(--card)","stroke-width":1});
    rect.addEventListener("mousemove",ev=>showTip(ev,fmtDate(d.date),
      d.v? [["Volume",r0(d.v).toLocaleString()+" kg"],["Session",d.name||"—"]] : [["Rest day","—"]]));
    rect.addEventListener("mouseleave",hideTip);
    svg.appendChild(rect);
  });
  ["Mon","","Wed","","Fri","","Sun"].forEach((t,i)=>{ if(!t) return;
    svg.appendChild(svgEl("text",{x:10,y:8+i*(cell+3)+cell*0.78,"text-anchor":"end","font-size":9,fill:"var(--muted)",
      "font-family":"Space Mono, monospace"},t)); });
  return svg;
}
</script>

<script>
/* ============================ trends ============================ */
function rangeDates(n){ const out=[]; for(let i=n-1;i>=0;i--) out.push(addDays(todayISO(),-i)); return out; }
function seriesFor(pid,dates){
  return dates.map(d=>{ const day=getDay(pid,d), t=dayTotals(day), w=workoutStats(day);
    return {date:d, kcal:t.kcal, p:t.p, c:t.c, f:t.f, fib:t.fib, volume:w.volume, sets:w.sets,
            cardio:w.cardioMin, weight:day.weightKg, name:day.workout.name, water:day.water||0, steps:day.steps||0}; });
}
function renderTrends(){
  const root=$("#view-trends"); root.innerHTML="";
  const pid = state.compare? "p1" : state.active;
  const p = state.profiles[pid], t = computeTargets(p);
  const dates = rangeDates(state.trendRange);
  const s = seriesFor(pid,dates);
  const logged = s.filter(d=>d.kcal>0);
  const avgK = logged.length? logged.reduce((a,b)=>a+b.kcal,0)/logged.length : 0;
  const avgP = logged.length? logged.reduce((a,b)=>a+b.p,0)/logged.length : 0;
  const trainDays = s.filter(d=>d.volume>0||d.cardio>0).length;
  const totVol = s.reduce((a,b)=>a+b.volume,0);
  const weights = s.filter(d=>d.weight!=null);
  const wDelta = weights.length>1 ? weights[weights.length-1].weight - weights[0].weight : null;
  const onTarget = logged.filter(d=> t.kcal>0 && Math.abs(d.kcal-t.kcal)<=t.kcal*0.1).length;
  const adherence = logged.length? Math.round(onTarget/logged.length*100) : 0;

  const head = el("div",{class:"card"});
  head.appendChild(el("div",{class:"card-h"},[
    el("h2",{text:"Trends — "+p.name}),
    el("div",{class:"seg"},[14,30,90].map(n=>el("button",{"aria-pressed":String(state.trendRange===n),
      onclick:()=>{ state.trendRange=n; render(); },text:n+"d"}))),
    el("button",{class:"btn btn-sm",onclick:()=>{ state.trendTable=!state.trendTable; render(); },
      text: state.trendTable? "Charts" : "Table"})
  ]));
  head.appendChild(el("div",{class:"tiles"},[
    el("div",{class:"tile"},[el("div",{class:"k",text:r0(avgK)}),el("div",{class:"l",text:"avg kcal / logged day"}),
      el("div",{class:"d",style:"color:"+(avgK>t.kcal?"var(--critical)":"var(--good)"),
        text:(avgK?((avgK>t.kcal?"+":"")+r0(avgK-t.kcal)+" vs target"):"—")})]),
    el("div",{class:"tile"},[el("div",{class:"k",text:r0(avgP)+"g"}),el("div",{class:"l",text:"avg protein"}),
      el("div",{class:"d",style:"color:var(--muted)",text:"target "+t.p+"g"})]),
    el("div",{class:"tile"},[el("div",{class:"k",text:trainDays}),el("div",{class:"l",text:"training days"}),
      el("div",{class:"d",style:"color:var(--muted)",text:r1(trainDays/state.trendRange*7)+" / week"})]),
    el("div",{class:"tile"},[el("div",{class:"k",text:(totVol/1000).toFixed(1)+"t"}),el("div",{class:"l",text:"total volume"})]),
    el("div",{class:"tile"},[el("div",{class:"k",text: wDelta==null? "—" : (wDelta>0?"+":"")+r1(wDelta)}),
      el("div",{class:"l",text:"kg body weight"})]),
    el("div",{class:"tile"},[el("div",{class:"k",text:adherence+"%"}),el("div",{class:"l",text:"days within 10% of target"})])
  ]));
  root.appendChild(head);

  if(state.trendTable){ root.appendChild(trendTable(s,t)); return; }

  const card = (title, sub, node, legend)=>{
    const c=el("div",{class:"card",style:"margin-top:16px"});
    c.appendChild(el("div",{class:"card-h"},[el("h2",{text:title}), sub? el("span",{class:"eyebrow",text:sub}):null]));
    const b=el("div",{class:"card-b"}); if(legend) b.appendChild(legend); b.appendChild(node); c.appendChild(b); return c;
  };
  const legend = items => el("div",{class:"legend"}, items.map(([lab,color])=>
    el("span",{class:"it"},[el("i",{class:"swatch",style:"background:"+color}),lab])));

  root.appendChild(card("Calories against target","last "+state.trendRange+" days", chartCalories(s,t.kcal)));
  root.appendChild(card("Macronutrients","grams per day", chartMacros(s),
    legend([["Protein","var(--s1)"],["Carbs","var(--s2)"],["Fat","var(--s3)"]])));

  const wsets = (state.compare? PIDS : [pid]).map(id=>({
    label: state.profiles[id].name, color: PCOLOR[id], domain: dates,
    points: seriesFor(id,dates).filter(d=>d.weight!=null)
      .map(d=>({d:d.date, v: state.units==="imperial" ? d.weight/KG_PER_LB : d.weight}))
  })).filter(x=>x.points.length);
  root.appendChild(card("Body weight", state.compare?"both profiles":"", 
    wsets.length? chartWeight(wsets) : el("div",{class:"empty",text:"No body-weight entries yet — add one on the Today tab."}),
    wsets.length>1? legend(wsets.map(w=>[w.label,w.color])) : null));

  const byGroup={};
  dates.forEach(d=>{ const day=getDay(pid,d);
    (day.workout.exercises||[]).forEach(ex=>{ const m=exById(ex.exId); if(!m) return;
      let v=0; (ex.sets||[]).forEach(st=>{ if(st.done) v+=(+st.weight||0)*(+st.reps||0); });
      byGroup[m.group]=(byGroup[m.group]||0)+v; }); });
  const gRows = Object.entries(byGroup).filter(r=>r[1]>0).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  root.appendChild(card("Volume by muscle group","sets × reps × load", chartVolumeByGroup(gRows)));

  root.appendChild(card("Training consistency","darker = more volume",
    chartConsistency(s.map(d=>({date:d.date, v:d.volume, name:d.name})))));
}
function trendTable(s,t){
  const c=el("div",{class:"card",style:"margin-top:16px"});
  c.appendChild(el("div",{class:"card-h"},[el("h2",{text:"The numbers"})]));
  const body=el("tbody",{});
  s.slice().reverse().forEach(d=> body.appendChild(el("tr",{},[
    el("td",{class:"num",text:d.date}),
    el("td",{class:"n",text:r0(d.kcal)}), el("td",{class:"n",text:r0(d.kcal-t.kcal)}),
    el("td",{class:"n",text:r0(d.p)}), el("td",{class:"n",text:r0(d.c)}), el("td",{class:"n",text:r0(d.f)}),
    el("td",{class:"n",text:r0(d.volume)}), el("td",{class:"n",text:d.sets}),
    el("td",{class:"n",text:d.cardio||""}), el("td",{class:"n",text:d.weight!=null?r1(d.weight):""})
  ])));
  c.appendChild(el("div",{class:"tbl-wrap"},[el("table",{},[
    el("thead",{},[el("tr",{},["Date","kcal","± target","P","C","F","Volume","Sets","Cardio","Weight"].map((h,i)=>
      el("th",{class:i?"n":"",text:h}))) ]), body ])]));
  return c;
}

/* ============================ plan ============================ */
function renderPlan(){
  const root=$("#view-plan"); root.innerHTML="";
  const pid = state.compare? "p1" : state.active, p = state.profiles[pid];
  const today = dowOf(todayISO());

  const train = el("div",{class:"card"});
  root.appendChild(el("div",{class:"section-head"},[
    el("div",{class:"eyebrow",text:"12-week plan · Mon / Wed / Fri / Sun training together"}),
    el("span",{class:"line"})]));
  train.appendChild(el("div",{class:"card-h"},[el("h2",{text:"Training week — "+p.name}),
    el("span",{class:"eyebrow",text:"tap a day to edit"})]));
  const week = el("div",{class:"week"});
  WEEK_ORDER.forEach(d=>{
    const day = p.plan[d]||{name:"Rest",items:[]};
    const c = el("div",{class:"day-card"+(d===today?" today":"")});
    c.appendChild(el("div",{class:"dow",text:DOW_LABEL[d]}));
    c.appendChild(el("div",{class:"title",text:day.name||"Rest"}));
    if(day.items.length){
      c.appendChild(el("ul",{}, day.items.map(it=>{ const x=exById(it.exId);
        return el("li",{},[ el("span",{text:(x&&x.name)||it.exId}),
          el("span",{text: x&&x.type==="cardio" ? (it.mins||20)+"′" : (it.sets||3)+"×"+(it.reps||8)}) ]); })));
    } else c.appendChild(el("div",{class:"rest",text:"Rest day"}));
    c.appendChild(el("div",{class:"foot"},[
      el("button",{class:"btn btn-sm",onclick:()=>editPlanDay(pid,d),text:"Edit"}),
      el("button",{class:"btn btn-sm btn-ghost",onclick:()=>{
        state.date = nextDateWithDow(d); state.tab="today"; state.compare=false; state.active=pid; render(); },text:"Go"})
    ]));
    week.appendChild(c);
  });
  train.appendChild(el("div",{class:"card-b"},[week]));
  root.appendChild(train);

  const meals = el("div",{class:"card",style:"margin-top:16px"});
  meals.appendChild(el("div",{class:"card-h"},[el("h2",{text:"Meal week — "+p.name}),
    el("span",{class:"eyebrow",text:"the day's default plate"})]));
  const mweek = el("div",{class:"week"});
  WEEK_ORDER.forEach(d=>{
    const mp = (p.mealPlan||{})[d]||{};
    let kcal=0; MEALS.forEach(([m])=> (mp[m]||[]).forEach(fid=>{ const f=foodById(fid); if(f) kcal += f.kcal*(f.servG||100)/100; }));
    const c = el("div",{class:"day-card"+(d===today?" today":"")});
    const tgt = computeTargets(p).kcal;
    c.appendChild(el("div",{class:"dow",text:DOW_LABEL[d]}));
    c.appendChild(el("div",{class:"title",text:r0(kcal)+" kcal planned"}));
    c.appendChild(el("div",{class:"slot",style:"padding:0 16px 6px;margin-top:-4px;color:"+
      (Math.abs(kcal-tgt)>tgt*0.1?"var(--coral)":"var(--muted)"),
      text:(kcal>tgt?"+":"")+r0(kcal-tgt)+" vs target "+r0(tgt)}));
    const ul = el("ul",{});
    MEALS.forEach(([m,label])=>{ const ids=mp[m]||[]; if(!ids.length) return;
      ul.appendChild(el("li",{},[ el("span",{class:"slot",text:label}) ]));
      ids.forEach(fid=>{ const f=foodById(fid); if(f) ul.appendChild(el("li",{},[el("span",{text:f.name}),el("span",{text:(f.servG||100)+"g"})])); });
    });
    c.appendChild(ul);
    c.appendChild(el("div",{class:"foot"},[ el("button",{class:"btn btn-sm",onclick:()=>editMealDay(pid,d),text:"Edit"}) ]));
    mweek.appendChild(c);
  });
  meals.appendChild(el("div",{class:"card-b"},[mweek]));
  root.appendChild(meals);
}
function nextDateWithDow(d){
  const want = WEEK_ORDER.indexOf(d);
  for(let i=0;i<7;i++){ const cand=addDays(todayISO(),i); if(WEEK_ORDER.indexOf(dowOf(cand))===want) return cand; }
  return todayISO();
}
function editPlanDay(pid,d){
  const p = state.profiles[pid];
  const day = JSON.parse(JSON.stringify(p.plan[d]||{name:"",items:[]}));
  const nameIn = el("input",{class:"inp",value:day.name||"","aria-label":"Session name",placeholder:"e.g. Push A, or Rest"});
  const rows = el("div",{style:"display:flex;flex-direction:column;gap:8px"});
  const draw = ()=>{
    rows.innerHTML="";
    day.items.forEach((it,i)=>{
      const x = exById(it.exId)||{name:it.exId,type:"strength"};
      const sel = el("select",{class:"inp"}, GROUPS.flatMap(g=> allExercises().filter(e=>e.group===g)
        .map(e=>el("option",{value:e.id,selected:e.id===it.exId?"selected":null,text:e.name}))));
      sel.addEventListener("change",()=>{ it.exId=sel.value; draw(); });
      const isCardio = (exById(it.exId)||{}).type==="cardio";

/* ---- export / import ---- */
function csvEsc(v){ const s=String(v??""); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
function toCSV(head, rows){ return [head.join(",")].concat(rows.map(r=>r.map(csvEsc).join(","))).join("\n"); }
function eachDay(fn){ PIDS.forEach(pid=>{ const bag=state.days[pid]||{};
  Object.keys(bag).sort().forEach(d=> fn(pid, d, bag[d])); }); }
function foodCSV(){
  const rows=[];
  eachDay((pid,d,day)=> MEALS.forEach(([m])=> (day.meals[m]||[]).forEach(e=>{
    const x=entryMacros(e), f=e.custom?{name:e.custom.name,cat:"one-off"}:(foodById(e.foodId)||{name:e.foodId,cat:""});
    rows.push([state.profiles[pid].name,pid,d,m,f.name,f.cat||"",e.grams??"",r1(x.kcal),r1(x.p),r1(x.c),r1(x.f),r1(x.fib)]);
  })));
  return toCSV(["person","profile_id","date","meal","food","food_group","grams","kcal","protein_g","carbs_g","fat_g","fibre_g"],rows);
}
function workoutCSV(){
  const rows=[];
  eachDay((pid,d,day)=>{
    (day.workout.exercises||[]).forEach(ex=>{ const m=exById(ex.exId)||{name:ex.exId,group:""};
      (ex.sets||[]).forEach((s,i)=> rows.push([state.profiles[pid].name,pid,d,day.workout.name||"",m.name,m.group,
        "strength",i+1,s.reps||0,s.weight||0,(s.weight||0)*(s.reps||0),r1(e1rm(+s.weight||0,+s.reps||0)),s.done?1:0,"",""])); });
    (day.workout.cardio||[]).forEach(c=>{ const m=exById(c.exId)||{name:c.exId};
      rows.push([state.profiles[pid].name,pid,d,day.workout.name||"",m.name,"Cardio","cardio","","","","","",1,c.minutes||0,c.distanceKm??""]); });
  });
  return toCSV(["person","profile_id","date","session","exercise","muscle_group","type","set_number","reps","weight_kg",
    "volume_kg","e1rm_kg","completed","minutes","distance_km"],rows);
}
function dailyCSV(){
  const rows=[];
  eachDay((pid,d,day)=>{ const t=dayTotals(day), w=workoutStats(day), tg=computeTargets(state.profiles[pid]);
    rows.push([state.profiles[pid].name,pid,d,dowOf(d),r1(t.kcal),tg.kcal,r1(t.p),r1(t.c),r1(t.f),r1(t.fib),
      r0(w.volume),w.sets,w.cardioMin,r0(w.cardioKcal),day.water||0,day.weightKg??"",day.steps??"",day.workout.name||""]); });
  return toCSV(["person","profile_id","date","weekday","kcal","kcal_target","protein_g","carbs_g","fat_g","fibre_g",
    "volume_kg","working_sets","cardio_min","cardio_kcal","water_glasses","body_weight_kg","steps","session"],rows);
}
function exportJSON(){
  return JSON.stringify({app:"plate-and-barbell",version:1,exportedAt:new Date().toISOString(),
    profiles:state.profiles, days:state.days, custom:state.custom, units:state.units}, null, 2);
}
function importJSON(text){
  try{
    const o = JSON.parse(text);
    if(!o || !o.profiles) throw new Error("not a Plate & Barbell backup");
    state.demo=false;
    PIDS.forEach(pid=>{ if(o.profiles[pid]) state.profiles[pid]=Object.assign(state.profiles[pid],o.profiles[pid],{id:pid});
      if(o.days&&o.days[pid]) state.days[pid]=o.days[pid]; save("profile|"+pid);
      Object.keys(state.days[pid]||{}).forEach(d=> save("day|"+pid+"|"+d)); });
    if(o.custom) { state.custom=o.custom; save("lib"); }
    if(o.units) { state.units=o.units; save("config"); }
    localSave(); render(); toast("Backup restored");
  }catch(e){ toast("Could not read that file — "+e.message); }
}
async function saveFile(filename, data){
  try{
    if(window.claude && window.claude.use){
      const dl = await claude.use("downloads");
      if(dl){ await dl.save({filename, data}); toast("Saved "+filename); return; }
    }
  }catch(e){ /* viewer declined, or downloads unavailable — fall through to copy */ }
  const ta = el("textarea",{class:"inp",rows:"14",style:"font-family:var(--mono);font-size:11.5px;width:100%"},data);
  openModal(filename,[ el("div",{class:"note",text:"Select all and copy — this view cannot write files directly."}), ta ],
    [el("button",{class:"btn btn-accent",onclick:()=>{ ta.select();
      try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Press ⌘C / Ctrl-C"); } },text:"Copy"})]);
  ta.focus(); ta.select();
}
</script>

<script>
/* ============================ render & wiring ============================ */
const VIEWS = ["today","plan","trends","library","settings"];
function render(){
  renderHeader();
  VIEWS.forEach(v=>{ $("#view-"+v).hidden = (v!==state.tab); });
  document.querySelectorAll(".tab").forEach(b=> b.setAttribute("aria-selected", String(b.dataset.tab===state.tab)));
  hideTip();
  if(state.tab==="today") renderToday();
  else if(state.tab==="plan") renderPlan();
  else if(state.tab==="trends") renderTrends();
  else if(state.tab==="library") renderLibrary();
  else if(state.tab==="settings") renderSettings();
}
document.querySelectorAll(".tab").forEach(b=> b.addEventListener("click",()=>{ state.tab=b.dataset.tab; render(); }));
$("#prevDay").addEventListener("click",()=>{ state.date=addDays(state.date,-1); render(); });
$("#nextDay").addEventListener("click",()=>{ state.date=addDays(state.date,1); render(); });
$("#todayBtn").addEventListener("click",()=>{ state.date=todayISO(); render(); });
$("#datePick").addEventListener("change",ev=>{ if(ev.target.value){ state.date=ev.target.value; render(); } });
$("#themeBtn").addEventListener("click",()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = isDark? "light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("pb_theme",next); }catch(e){}
  render();
});
try{ const th=localStorage.getItem("pb_theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}

let rt=null;
window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(state.tab==="trends"||state.tab==="today") render(); },220); });
window.addEventListener("scroll",hideTip,{passive:true});

/* keep state across a republish while someone has the page open */
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(()=>({tab:state.tab, date:state.date, active:state.active, compare:state.compare, range:state.trendRange}));
    const startWith = d => { if(d){ if(d.tab) state.tab=d.tab; if(d.date) state.date=d.date;
      if(d.active) state.active=d.active; if(typeof d.compare==="boolean") state.compare=d.compare;
      if(d.range) state.trendRange=d.range; } boot(); };
    window.claude.hot.ready ? window.claude.hot.ready(startWith) : startWith(window.claude.hot.data);
  } else boot();
}catch(e){ boot(); }
</script>
